<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>무사귀환 · 프로토 v4</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#18110d;--panel:#2a1d14;--panel2:#33241a;--line:#4a3424;--paper:#eadfc6;--paper2:#d8c8a6;--paper-ink:#3b2f27;--pmute:#7a6b58;--gold:#d9b46c;--brass:#cda65f;--brass2:#9c7a3c;--brass-hi:#f0d492;--ol:#382c2b;--ink:#f2e8d4;--mute:#bfae90;--red:#b0402f;--green:#4f8a5a;--teal:#2f7a80;--inkred:#a8322a;--inkblue:#2f4f9a;--drop:0 10px 22px #0008;--kr:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mag:"Gowun Batang","AppleMyungjo","Batang",serif;--ari:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--mono:"Nanum Gothic Coding",monospace;
 --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .26  0 0 0 0 .16  0 0 0 .38 -.15'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='.4 .4 .4 0 -.1  .4 .4 .4 0 -.1  .4 .4 .4 0 -.1  0 0 0 0 1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 --wood:repeating-linear-gradient(180deg,#0000 0 11px,#0000001c 11px 12px,#0000 12px 23px,#ffffff09 23px 24px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:repeating-linear-gradient(90deg,#0000 0 139px,#00000066 139px 141px,#ffffff07 141px 142px),linear-gradient(180deg,#241913,#18110d 60%,#130d0a);color:var(--ink);font-family:var(--kr);min-width:1100px;overflow:hidden}
button{font-family:var(--kr);touch-action:manipulation}
/* 상단 HUD: 나무 간판 + 명판 */
header{display:flex;align-items:center;gap:8px;padding:0 14px;height:52px;white-space:nowrap;position:relative;z-index:10;background:var(--wood),linear-gradient(#58392a,#402a1c);border-bottom:3px solid var(--ol);box-shadow:inset 0 2px 0 #7a5638,0 4px 0 #0006}
header h1{flex:none;font-size:19px;font-weight:900;color:var(--brass-hi);text-shadow:0 2px 0 var(--ol);margin-right:4px}
header h1 small{font-size:11.5px;font-weight:800;margin-left:8px;color:var(--ol);background:var(--brass);border:2px solid var(--ol);border-radius:4px;padding:1px 6px;text-shadow:none;vertical-align:3px}
.sp{flex:1}
.stat{font-size:12px;color:#dcc6a0;display:flex;align-items:center;gap:5px;height:32px;padding:0 9px;background:#221710;border:2px solid var(--ol);border-radius:6px;box-shadow:inset 0 2px 0 #0007,0 1px 0 #7a5638}
.stat b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.gold b{color:var(--brass-hi)}.stat.r b{color:#f19a8b}
.hi{display:inline-flex;line-height:0}.hi:empty{display:none}
.gauge{display:inline-block;position:relative;width:100px;height:13px;background:#0e0a07;border-radius:7px;overflow:hidden;border:2px solid var(--ol);box-shadow:inset 0 2px 3px #000c}
.gauge::after{content:"";position:absolute;left:5px;right:5px;top:2px;height:2px;border-radius:2px;background:#ffffff30}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a5ec9,#c9493a);box-shadow:inset 0 -3px 0 #0003;transition:width 1.2s ease}
#snd,#flt{background:linear-gradient(#f3d995,#d4ae62);border:2px solid var(--ol);color:var(--ol);font-weight:800;font-size:12px;border-radius:6px;padding:4px 9px;cursor:pointer;box-shadow:0 2px 0 var(--ol)}
#snd:active,#flt:active{transform:translateY(2px);box-shadow:none}
#snd.off,#flt.off{background:#3a2a1f;color:#bfae90}
.momoMini{width:26px;height:31px;display:inline-block;line-height:0}.momoMini svg{width:26px;height:31px}
/* 밤: 창구 */
main.night{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(280px,340px);gap:14px;padding:12px 14px;height:calc(100vh - 52px)}
.left{display:flex;flex-direction:column;gap:12px;min-height:0}
.reg{background:var(--tex),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:6px;padding:11px 12px 10px;flex:none;position:relative;box-shadow:0 4px 0 var(--ol),var(--drop)}
.reg::before{content:"";position:absolute;right:46px;top:-10px;width:11px;height:30px;border:2.5px solid #9aa0a8;border-radius:6px;box-shadow:0 0 0 1.5px var(--ol),inset 0 0 0 1.5px var(--ol);pointer-events:none}
.reg h3,.dep h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--pmute);margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px dashed #b9a57f}
.reg .top{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start}
.reg .ph{width:104px;height:125px;background:#d9c7a0;border:4px solid #f7f1e3;box-shadow:0 0 0 2px var(--ol),0 3px 0 2px var(--ol);border-radius:2px;overflow:hidden;line-height:0;transform:rotate(-1.5deg)}
.reg .ph svg{width:100%;height:100%}
.reg .nm{font-size:19px;font-weight:900;color:var(--ol)}.reg .rc{font-size:12px;color:var(--pmute);margin-bottom:4px}
.cardRow{display:grid;grid-template-columns:40px 1fr;font-size:13px;padding:1px 0;line-height:1.5}
.cardRow>span:first-child{color:var(--pmute)}
.cardRow .no{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.05em}
.knotSw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--ol)}
.eyeSw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--ol)}
.reg .fl{font-size:13px;border-top:1.5px dashed #b9a57f;padding-top:6px;margin-top:7px}
.reg .memo{font-family:var(--ari);color:var(--inkblue);font-size:14px;line-height:1.5;margin-top:4px}
.reg .empty{height:250px;display:grid;place-items:center;color:#8a7c66;font-size:14px;text-align:center;line-height:1.7}
.wallBell{position:absolute;right:10px;top:8px;line-height:0;transform-origin:50% 0}
.wallBell.ring,.bellMark.ring{animation:ring .45s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(20deg)}75%{transform:rotate(-20deg)}}
.stampMark{position:absolute;right:12px;top:36px;transform:rotate(12deg);border:3px solid var(--inkred);color:var(--inkred);font-weight:900;padding:2px 8px;border-radius:6px;font-size:14px;background:#eadfc6cc}
.dep{background:var(--tex),linear-gradient(90deg,#0000 24px,#c0504070 24px 25.5px,#0000 25.5px),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:6px;padding:10px 12px 10px 32px;flex:1;min-height:0;overflow:auto;box-shadow:0 4px 0 var(--ol),var(--drop)}
.dep .cnt{font-size:13px;color:var(--pmute);margin-bottom:4px}.dep .cnt b{color:var(--ol)}.dep .cnt.over b{color:var(--inkred)}
.dep .row{display:grid;grid-template-columns:62px 1fr 64px;font-size:13px;padding:4px 2px;border-bottom:1px solid #c9b996;color:var(--paper-ink)}
.dep .row .flc{color:#9a8b72}
.dep .row .st{text-align:right;color:#9a8b72}.dep .row.back .st{color:var(--inkblue);font-family:var(--ari);font-size:14px}
.dep .row.now{background:linear-gradient(transparent 52%,#f2c14e80 52%)}.dep .row.now .st{color:#8a5a14;font-weight:800}
.dep .row.x,.dep .row.x .st{color:var(--inkred)}
.dep .sulk{color:var(--inkred);font-size:11px;margin-left:3px}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.win{position:relative;flex:1;overflow:hidden;border:10px solid #4a3222;border-bottom:0;border-radius:8px 8px 0 0;background:radial-gradient(circle at 22% 8%,#ffb45a2e,transparent 36%),linear-gradient(#1d1a17,#0a0908);box-shadow:inset 0 0 0 2.5px var(--ol),0 0 0 2.5px var(--ol)}
.win .door{position:absolute;left:7%;top:20%;width:15%;height:80%;background:#00000055;border:2px solid #ffffff0a;border-bottom:0}.win .door.r{left:auto;right:7%}
.win .lampL{position:absolute;left:21%;top:3%;width:14px;height:20px;background:#ffcf6a;border-radius:3px;box-shadow:0 0 34px 12px #ffb45a50}
.win .vig{position:absolute;inset:0;box-shadow:inset 0 0 140px #000;pointer-events:none;z-index:4}
.win .wall{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 58%,#b98a58 0%,#7a522e 35%,#3a2616 62%,transparent 85%);opacity:0;transition:opacity .3s;z-index:1}
.win.lit .wall{opacity:1}
.person{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:2;line-height:0}
.person svg,.shadow svg{height:min(50vh,330px);width:auto}
.shadow{position:absolute;bottom:0;left:50%;z-index:1;line-height:0;filter:brightness(0) blur(1px);opacity:.72;transform:translateX(-50%) translate(-150px,-34px) scale(.96) skewX(-8deg);display:none}
.shadow.s2{transform:translateX(-50%) translate(150px,-30px) scale(.96) skewX(8deg)}
.win.lit .shadow{display:block}
.bellMark{position:absolute;z-index:3;left:calc(50% - 118px);bottom:22px;line-height:0;transform-origin:50% 0}
.tray{position:absolute;right:16px;bottom:12px;z-index:6;background:var(--tex),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 3px 0 var(--ol),0 8px 18px #0008;transform:rotate(-2deg)}
.tray b{font-size:16px;color:var(--ol)}.tray small{display:block;color:var(--pmute);font-size:12px}
/* 말풍선: 그림과 같은 윤곽선 */
.bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fbf6ea;color:var(--ol);padding:10px 18px;border:2.5px solid var(--ol);border-radius:14px;box-shadow:0 3px 0 var(--ol);font-size:16px;font-weight:500;max-width:86%;text-align:center;z-index:6;line-height:1.5}
.bubble::before{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ol);border-bottom:0}
.bubble::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7.5px solid transparent;border-top-color:#fbf6ea;border-bottom:0}
.bubble.sys{background:#120d0acc;color:#e0d3bb;font-style:italic;border-color:#0009;box-shadow:none}.bubble.sys::before,.bubble.sys::after{display:none}
.bubble .qq{display:block;font-size:12.5px;color:var(--pmute);margin-bottom:2px}
.bubble.momo{background:#e3f0cc;color:#23401b;top:auto;bottom:18px;left:18px;transform:none;max-width:52%;text-align:left}
.bubble.momo::before,.bubble.momo::after{display:none}
.shutter{position:absolute;inset:0;z-index:5;background:repeating-linear-gradient(180deg,#50545b 0 3px,#3f4248 3px 18px,#2b2d31 18px 20px,#1d1e21 20px 23px);transition:transform .42s cubic-bezier(.55,0,.3,1);display:grid;place-items:center;cursor:pointer}
.shutter.up{transform:translateY(-101%)}.shutter.slam{transition:transform .12s ease-in}
.knock{font-size:46px;font-weight:900;color:#ffffff40;letter-spacing:.35em;min-height:60px}
.knock span{display:inline-block;animation:kn .35s ease-out}
@keyframes kn{0%{transform:scale(1.6);color:#ffffffbb}100%{transform:scale(1)}}
.shutter .hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#ffffff66;font-size:13px}
.stamp{position:absolute;top:42%;left:50%;z-index:6;border:5px solid;padding:4px 20px;font-size:40px;font-weight:900;letter-spacing:.08em;border-radius:8px;transform:translate(-50%,-50%) rotate(-10deg);animation:st .22s ease-out;background:#00000030}
@keyframes st{0%{transform:translate(-50%,-50%) rotate(-10deg) scale(2);opacity:0}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.stamp.pass{color:#8fd6a3;border-color:#8fd6a3}.stamp.treat{color:#7fd0c8;border-color:#7fd0c8}.stamp.iso{color:#ff8a78;border-color:#ff8a78}
.cost{position:absolute;left:50%;top:40%;z-index:7;color:#ffd48a;font-weight:800;font-size:18px;animation:up 1s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
/* 창구 책상: 서류 */
.counter{flex:none;height:132px;background:var(--wood),linear-gradient(#654530,#523926);border-top:3px solid var(--ol);box-shadow:inset 0 3px 0 #8a6040;display:flex;gap:22px;align-items:center;justify-content:center;padding:6px 16px}
.counter .none{color:#eed9b4cc;font-size:14px}
.docLbl{font-size:11.5px;color:#f3e2c2;letter-spacing:.04em;margin-bottom:4px;display:flex;justify-content:space-between;text-shadow:0 1px 0 #0006}
.docLbl kbd{font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--ol);color:var(--brass-hi);border-radius:3px;padding:0 4px;margin-left:3px;text-shadow:none}
.tagWrap{perspective:700px;width:200px;height:96px;cursor:pointer}
.tag{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tag.flip{transform:rotateY(180deg)}
.tagF,.tagB{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(135deg,#e4e8ec,#a3abb5 55%,#cfd4da);border:2.5px solid var(--ol);box-shadow:inset 0 1px 0 #fff8,0 3px 0 var(--ol),0 6px 10px #0006;color:#2a2f36;padding:7px 10px 7px 28px;overflow:hidden}
.tagB{transform:rotateY(180deg);display:flex;align-items:center;justify-content:space-around}
.hole{position:absolute;left:9px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#3a2a1e;box-shadow:inset 0 1px 2px #000}
.tag .tn{font-weight:800;font-size:15px;line-height:1.3}.tag .tr{font-size:11px;color:#4a525c}
.tag .no{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.1em;margin-top:1px}
.tag .knot{position:absolute;right:8px;top:6px;text-align:center;font-size:10px;font-weight:800;color:#2a2f36;line-height:1}
.tag .scr{position:absolute;inset:0;pointer-events:none}
.tallyBox{cursor:pointer;line-height:0}
.tallyBox g.ret{transition:transform .45s ease}
.tlab{display:flex;justify-content:space-between;width:330px;font-size:11px;color:#f3e2c2;margin-top:2px}
/* 책상 아래칸: 도구 패 + 고무도장 */
.desk{height:96px;flex:none;background:var(--wood),linear-gradient(#4a3222,#3b2819);border-top:3px solid var(--ol);border-radius:0 0 8px 8px;box-shadow:0 0 0 2.5px var(--ol);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px}
.desk button{position:relative;font-weight:800;border:2.5px solid var(--ol);border-radius:7px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 var(--ol);transition:transform .06s,box-shadow .06s}
.desk button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.desk button:disabled{opacity:.42;cursor:default;box-shadow:0 1px 0 var(--ol);transform:translateY(3px)}
.desk kbd{font-family:var(--mono);font-size:10.5px;font-weight:700;margin-left:6px;background:var(--ol);color:var(--brass-hi);border-radius:3px;padding:1px 4px;vertical-align:1px;text-shadow:none}
.big{font-size:17px;padding:12px 18px}
.tools{display:grid;grid-template-columns:repeat(4,auto);gap:8px 6px}
.tools button{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;padding:5px 7px 5px 6px;border-width:2px;background:linear-gradient(#f3e7c9,#e3cfa4);color:var(--ol);box-shadow:0 3px 0 var(--ol)}
.tools button .ti{display:inline-flex;line-height:0}
.tools button.on{background:linear-gradient(#ffe7a3,#f2c14e);box-shadow:0 3px 0 var(--ol),0 0 16px #f2c14e99}
.tools kbd{margin-left:3px}
.desk .stampB{margin-top:10px}
.desk .stampB::before{content:"";position:absolute;left:50%;top:-13px;width:40px;height:11px;margin-left:-20px;background:linear-gradient(#94694a,#6a4a30);border:2.5px solid var(--ol);border-bottom:0;border-radius:10px 10px 0 0}
.b-open{background:linear-gradient(#f3d995,#d4ae62);color:var(--ol)}.b-ign{background:#2c2019;color:#e7dcc0}
.b-pass,.b-treat,.b-iso,.b-conf{color:#fff8e6;text-shadow:0 2px 0 #0005}
.b-pass{background:linear-gradient(#5f9d6a,#4a8456)}.b-treat{background:linear-gradient(#3d8e94,#2d747a)}.b-iso{background:linear-gradient(#c5533e,#a83e2d)}
.b-buy{background:linear-gradient(#f3d995,#d4ae62);color:var(--ol)}.b-no{background:#2c2019;color:#f2e8d4}.b-conf{background:linear-gradient(#7d4d8c,#63386f)}
.vb small{display:block;font-size:11px;font-weight:700;opacity:.92}
.vb.over small{color:#ffe0a0}
.sep{width:2px;height:58px;background:#0006;box-shadow:1px 0 0 #ffffff14;margin:0 4px}
.tradeLbl{color:#f3e2c2;font-size:14px;margin-right:6px;text-align:right}.tradeLbl b{font-size:16px}
/* 수칙집: 제본된 책 한 쪽 */
.book{position:relative;background:var(--tex),linear-gradient(90deg,#0000003d,#0000 20px),repeating-linear-gradient(180deg,transparent 0 35px,#c9b99666 35px 36px),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:4px 8px 8px 4px;padding:14px 16px 12px 22px;overflow:auto;box-shadow:0 4px 0 var(--ol),var(--drop)}
.book::before{content:"";position:absolute;top:0;right:18px;width:14px;height:44px;background:var(--inkred);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.book h2{font-size:17px;font-weight:900;color:var(--ol);padding-right:30px}.book .by{font-family:var(--mag);font-size:14px;color:#6e2a1c;margin:2px 0 8px}
.pwBox{position:relative;background:#f6e7a6;color:var(--ol);border:2px solid var(--ol);border-radius:3px;padding:9px 12px;margin:8px 0 10px;font-size:13.5px;line-height:1.6;box-shadow:0 3px 0 var(--ol);transform:rotate(-.6deg)}
.pwBox::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#c9493a;border:2px solid var(--ol)}
.pwBox b{color:var(--inkred)}
.ref{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--pmute);margin-bottom:10px;background:#e2d4b4aa;border:1.5px dashed #a8946c;border-radius:6px;padding:6px 8px;line-height:1.5}
.book ol{list-style:none}
.book li{display:grid;grid-template-columns:22px 1fr;gap:4px;margin-bottom:9px;line-height:1.5;position:relative;border-radius:4px}
.book li .n{font-weight:800;font-size:14px;color:var(--pmute);padding-top:1px}
.ink-m{font-family:var(--mag);font-size:15.5px;color:#6e2a1c;line-height:1.55}
.ink-k{font-family:var(--mono);font-size:13.5px;color:#222;line-height:1.55;letter-spacing:-.02em}
.ink-a{font-family:var(--ari);font-size:15.5px;color:var(--inkblue);line-height:1.55}
.book li.red .ink-m{color:#b3261e}.book li.red{border-left:4px solid #b3261e;padding-left:4px}
.book li.new::after{content:"새 줄";position:absolute;right:-4px;top:-8px;font-size:10.5px;font-weight:900;color:var(--inkred);background:#eadfc6;border:2px solid var(--inkred);padding:0 4px;border-radius:4px;transform:rotate(8deg);font-family:var(--kr)}
.book li.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%{background:#ffd48a}100%{background:transparent}}
.toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);padding:9px 18px;border-radius:6px;font-weight:700;z-index:40;font-size:15px;max-width:780px;text-align:center;background:var(--tex),var(--paper);color:var(--ol);border:2.5px solid var(--ol);border-left-width:9px;box-shadow:0 3px 0 var(--ol),0 10px 20px #0008}
.toast.ok{border-left-color:#4a8456}.toast.bad{border-left-color:var(--inkred)}.toast.q{border-left-color:#5a4a8a}.toast.info{border-left-color:var(--brass2)}

.primary:disabled{opacity:.45;cursor:default}.ghost{background:#3a2a1f;color:#f2e8d4}
.news{display:grid;grid-template-columns:162px 1fr;gap:20px;align-items:center;padding:4px 4px 8px}

.calc{margin:12px 0;font-size:14px}

details{margin-top:8px;color:var(--paper-ink)}details summary{cursor:pointer;color:#8a5a14;font-weight:700}

.res li.ok .ic{color:#3f7a4f}.res li.bad{background:#f3ddd2;border-color:#d9a595}.res li.bad .ic{color:var(--inkred)}.res li.q .ic{color:#5a4a8a}

.office{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(270px,320px);gap:14px;padding:12px 16px;height:calc(100vh - 52px);background:radial-gradient(ellipse 70% 60% at 18% 0%,#ffd9a024,transparent 70%)}

.inv{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;background:var(--tex),var(--paper);color:var(--paper-ink);border:2px solid var(--ol);border-radius:7px;padding:10px;box-shadow:0 3px 0 var(--ol)}

/* 아날로그 필터: 입자·색감·비네트. 돋보기 자리는 뚫는다 */
.film{position:fixed;inset:0;pointer-events:none;z-index:95;-webkit-mask-image:radial-gradient(circle at var(--lx,-600px) var(--ly,-600px),#0000 var(--lr,0px),#000 calc(var(--lr,0px) + 3px));mask-image:radial-gradient(circle at var(--lx,-600px) var(--ly,-600px),#0000 var(--lr,0px),#000 calc(var(--lr,0px) + 3px))}
.film-grain{background-image:var(--grain);mix-blend-mode:overlay;opacity:.42;animation:grain .5s steps(1) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-37px 51px}50%{background-position:63px -18px}75%{background-position:-12px -77px}100%{background-position:29px 88px}}

.film-lift{background:#1c120c;mix-blend-mode:lighten;opacity:.38}
.film-vig{background:radial-gradient(ellipse 85% 80% at 50% 46%,#0000 58%,#0a0503a8 100%);animation:vflk 2.4s steps(1) infinite}

.overlay:not([hidden])~.film-grain{opacity:.28}

  if(cs.unknownSand)return '뜨거운 붉은 달 냄새… 아파 보여. 등불 옆에서 푹 쉬게 해 줘.';
  const s=sevOf(cs);
  if(s==='danger')return `…이거 ${n} 아니야. 냄새가 텅 비었어. 가둬.`;
  if(s==='mild')return cs.o&&cs.o.shadow==='two'?'그림자 냄새가 두 겹이야! 치료소!':'킁! 버섯이랑 흙냄새… 치료소 가야 돼.';
  return `킁킁… 그냥 ${n} 냄새야. 괜찮아.`;
}
function record(v,st){
  const cs=V.cur;let grade;
  if(cs.grade)grade=cs.grade[v]||'bad';else if(st==='q')grade='odd';else grade=st==='ok'?'good':'bad';
  const r={cs,v,st,grade};V.results.push(r);S.log.push({d:S.day,id:cs.id,name:nameOf(cs),v,st,grade});hud();return r;
}
function decide(v){
  if(!V||V.state!=='open')return;
  V.state='busy';const cs=V.cur;const e=expect(cs);let st;
  if(e.q)st='q';else if(e.v===v)st='ok';else{st='bad';V.warn++;}
  if(v==='iso'){if(V.iso>=S.caps.iso)V.over.iso++;else V.iso++;}
  if(v==='treat'){if(V.bed>=S.caps.bed)V.over.bed++;else V.bed++;}
  const s=$('stamp');s.hidden=false;s.className='stamp '+v;s.textContent=VN[v];snd('stamp');
  record(v,st);desk();
  const rc=(cs.react&&cs.react[v])||(cs.hood?'…':C[cs.c][v==='pass'?'bye':v]);
  later(()=>bubble(rc),380);
  if(v==='iso'&&cs.item&&ITEMS[cs.item].contra){S.inv.push({k:cs.item,got:S.day,conf:1});later(()=>toast(`격리하면서 ${ITEMS[cs.item].n}을(를) 압수했다`,'info'),700);}
  if(cs.gift){S.inv.push({k:cs.gift,got:S.day});later(advance,1700);return;}
  if((v==='pass'||v==='treat')&&cs.item){
    if(cs.sulky){later(()=>bubble('오늘은 안 팔아.'),1000);later(advance,1900);return;}
    later(()=>{V.state='trade';showTray(cs);desk();V.tradeAt=performance.now();},900);return;
  }
  later(advance,1500);
}
function tradeAct(a){
  if(!V||V.state!=='trade'||performance.now()-(V.tradeAt||0)<250)return;
  const cs=V.cur,it=ITEMS[cs.item],fake=sevOf(cs)==='danger';
  if(a==='buy'){if(S.money<it.buy)return;S.money-=it.buy;snd('coin');
    S.inv.push({k:cs.item,got:S.day,secret:it.contra?1:0,fake:fake?1:0});
    if(it.contra){V.secret.push(cs.item);toast(`${it.n}을(를) 몰래 매입했다`,'info');}else toast(`${it.n} 매입 −${it.buy}G`,'info');}
  if(a==='conf'){
    if(it.contra){S.inv.push({k:cs.item,got:S.day,conf:1});if(!fake)V.sulkyAdd.push(cs.c);toast(`✓ 수칙 7 — ${it.n} 압수`,'ok');bubble('…그거 비싼 건데.');}
    else{S.inv.push({k:cs.item,got:S.day,conf:1,fake:fake?1:0});V.warn++;if(!fake)V.sulkyAdd.push(cs.c);toast('✗ 금지품이 아닌 물건을 압수했다','bad');bubble('뭐?! 그걸 왜 가져가?!');}
  }
  if(a==='no')bubble('그래? 알았어.');
  V.state='busy';$('tray').hidden=true;desk();hud();later(advance,a==='no'?700:1000);
}
function advance(){

}
function memoRed(){

  ov(`<h2>책상 서랍 안쪽에서</h2><p>쪽지 한 장이 붙어 있었다. 마그다의 글씨다. 붉은 잉크로.</p>${ruleLines([8])}<p><b>붉은 줄은 어기면 끝입니다.</b> 이제 셔터를 열지 않고 <b>모른 척</b>(X) 할 수 있습니다.</p><button class="primary" id="m8">알겠다</button>`);
  $('m8').onclick=()=>{closeOv();const li=document.querySelector('.book li[data-n="8"]');if(li)li.classList.add('flash');run();nextCase();};
}
function timeUp(){
  V.running=false;tok++;
  const done=new Set(V.results.map(r=>r.cs));
  V.cases.slice(V.ci).forEach(cs=>{if(done.has(cs)||cs.knocks===3)return;V.cur=cs;record('missed',cs.hood?'q':'bad');if(!cs.hood)V.warn++;});
  V.state='idle';desk();toast('창구 마감 — 남은 귀환자는 복도에서 밤을 샌다','bad');

// ───────── 게임 오버 ─────────
function gameOver(kind){
  if(V)V.running=false;tok++;
  const T={red:['붉은 줄','셔터가 안쪽에서 두드려졌다. 세 번. 아리는 대답했다.<br>수칙 8번: 창구를 세 번 두드리면 절대 열지 마십시오.'],

   shut:['폐업','주말 운영비를 내지 못했다. 경계청이 13번 출입구에 봉인 딱지를 붙였다. 단골들은 다른 길드로 떠났다.']}[kind];

// ───────── 아침 ─────────
function morning(){const R=applyNight();hud();if(S.contam>=100){gameOver('door');return;}news(R);}
function spreadKey(cs){const o=cs.o||{};if(o.shadow==='two')return 'shadow2';if(o.backMush)return 'backMush';if(o.backMoss)return 'backMoss';if(o.moss)return 'moss';return 'mushroom';}
function applyNight(){
  const d=S.day,cD=[],mD=[],stamp=[],notes=[];let dc=0,treats=0;
  const addC=(n,w)=>{dc+=n;cD.push([n,w]);},addM=(n,w)=>{S.money+=n;mD.push([n,w]);};
  const carry={spread:[],fakes:[]};
  V.results.forEach(r=>{
    const cs=r.cs,v=r.v,nm=nameOf(cs),sev=sevOf(cs);if(v==='treat')treats++;
    if(cs.knocks===3||cs.hood)return;
    if(sev==='danger'){
      if(v==='pass'){addC(20,`${nm} (가짜)를 통과시킴`);if(d<4)carry.fakes.push(cs);}
      else if(v==='treat')addC(10,`${nm} (가짜)를 치료소로 보냄`);
      else if(v==='ignore'||v==='missed')addC(10,`${nm} (가짜)가 복도에서 사라짐`);
    }else if(sev==='mild'){
      if(v==='pass'){addC(6,`${nm}의 증상을 통과시킴 → 번짐`);if(d<4)carry.spread.push({ov:spreadKey(cs),from:cs.c});}
      else if(v==='ignore'||v==='missed')addC(3,`${nm}이(가) 증상을 단 채 복도에서 밤샘`);
      else if(v==='iso')stamp.push(cs.c);
    }else if(sev==='unknown'){
      if(v==='pass')addC(12,`${nm}의 붉은 모래 눈을 통과시킴`);
      else if(v==='missed'||v==='ignore')addC(6,`${nm}의 붉은 모래 눈이 복도에서 번짐`);
      else if(v==='iso')stamp.push(cs.c);
    }else if(['treat','iso','ignore','missed'].includes(v))stamp.push(cs.c);
  });
  V.secret.forEach(k=>addC(6,`${ITEMS[k].n} 몰래 매입`));
  S.inv.filter(it=>ITEMS[it.k].contra&&it.got<d).forEach(it=>addC(3,`${ITEMS[it.k].n} 보관 (1박)`));
  const spoiled=S.inv.filter(it=>ITEMS[it.k].food&&it.got<d);if(spoiled.length)notes.push(`음식 ${spoiled.length}개가 상해서 버렸다.`);
  S.inv=S.inv.filter(it=>!(ITEMS[it.k].food&&it.got<d));
  S.inv.forEach(it=>{if(it.fake&&!it.rev){it.rev=1;if(it.k==='coin'){it.k='leaf';notes.push('금화가 밤사이 나뭇잎으로 변해 있었다.');}else if(it.k==='shadow'){it.gone=1;notes.push('그림자 조각이 창고 벽을 타고 사라졌다.');}}if(it.k==='spore'&&!it.rev){it.rev=1;notes.push('정원 버섯에서 포자가 피어올랐다. 포자 버섯이었다.');}});
  S.inv=S.inv.filter(it=>!it.gone);
  if(treats)addM(-COST.treat*treats,`치료비 ${treats}명`);
  if(V.over.iso)addM(-COST.iso*V.over.iso,`격리실 초과 — 경계청 호송 ${V.over.iso}명`);
  if(V.over.bed)addM(-COST.bed*V.over.bed,`침대 초과 — 간이 침대 ${V.over.bed}개`);
  if(V.warn>2)addM(-5*(V.warn-2),`경고장 ${V.warn}장 (2장 초과분 벌금)`);
  let audit='';
  if(d>=2&&rnd()<.35){
    const sec=S.inv.filter(it=>it.secret),conf=S.inv.filter(it=>it.conf&&ITEMS[it.k].contra);
    if(sec.length){addM(-10*sec.length,`불시 감찰: 몰래 산 금지품 ${sec.length}개 적발`);audit=`케인이 불시 감찰을 왔다. 몰래 산 ${sec.map(x=>ITEMS[x.k].n).join(', ')}이(가) 적발됐다.`;}
    else{addM(5,'불시 감찰: 깨끗함 (성실 보상)');audit='케인이 불시 감찰을 왔다. "깨끗하군." 성실 보상 5G.';}
    if(conf.length)addM(10*conf.length,`압수품 ${conf.length}개 납품`);
    S.inv=S.inv.filter(it=>!(it.secret||(it.conf&&ITEMS[it.k].contra)));
  }
  const stamps=[...new Set([...stamp,...V.sulkyAdd])];stamps.forEach(c=>S.rels[c]='sulky');
  const before=S.contam;S.contam=Math.max(0,Math.min(100,S.contam+dc));
  S.carry=carry;
  return{cD,mD,stamps,notes,audit,before,head:headline()};
}
function headline(){
  const R=V.results,p=f=>R.find(f),sv=r=>sevOf(r.cs);
  const pick=p(r=>sv(r)==='danger'&&r.v==='pass')||p(r=>r.cs.unknownSand)||p(r=>sv(r)==='mild'&&r.v==='pass')||p(r=>r.cs.conflict)||p(r=>r.cs.hood)||p(r=>sv(r)==='danger'&&r.v==='iso')||p(r=>r.cs.knocks===3);
  if(!pick)return{fig:null,text:'조용한 밤이었다. 모두 제 발로 걸어 들어갔다.'};
  const cs=pick.cs,o=cs.o||{},t=(cs.out&&cs.out[pick.v])||outText(pick);
  return{fig:cs.knocks===3?fig('void'):cs.hood?fig('hood'):fig(cs.c,o,!!(o.backFace||o.backMush||o.backMoss)),text:t};
}
function outText(r){
  const cs=r.cs,nm=nameOf(cs);

  if(r.v==='ignore')return `${nm}: 창구가 열리지 않아 복도에서 밤을 샜다. "아리, 자냐?"`;
  if(r.v==='treat')return `${nm}: 멀쩡한데 치료소에서 쓴 약만 먹었다.`;
  if(r.v==='iso')return `${nm}: 격리실에서 밤새 억울해했다. "내가 뭘 했다고…"`;

}
function news(R){

  if(!S.inv.length){box.innerHTML='<div class="emptyInv">창고가 비어 있다.</div>';return;}
  box.innerHTML=S.inv.map((it,i)=>{const I=ITEMS[it.k];const nm=it.k==='spore'&&it.rev?I.n2:I.n;
    const tg=[I.contra?(it.secret?'<span class="tg contra">금지품 · 몰래 매입</span>':'<span class="tg conf">금지품 · 압수품</span>'):'',it.k==='spore'&&it.rev?'<span class="tg spore">포자</span>':'',I.food?'<span class="tg food">음식 · 내일 상함</span>':'',it.k==='leaf'?'<span class="tg leaf">가치 없음</span>':''].join('');
    const bs=buyersFor(it).map(([b,p])=>{const lab={dora:`도라 ${p}G`,kane:`케인 납품 ${p}G`,enoch:`에녹 ${p}G`,helga:`헬가 요리 ${p}G`,momo:`모모에게 먹이기 (+${p})`}[b];return `<button class="${b}" data-i="${i}" data-b="${b}">${lab}</button>`;}).join('')+(it.k==='leaf'?`<button data-i="${i}" data-b="toss">버리기</button>`:'');
    return `<div class="inv"><div class="ic">${icon(it.k==='spore'&&!it.rev?'mush':it.k,56)}</div><div><span class="nm">${nm}</span>${tg}<div class="bs">${bs||(I.gift?'<span class="nobuy">팔 수 없다. 마그다의 등불이다.</span>':'<span class="nobuy">오늘 사 갈 손님이 없다</span>')}</div></div></div>`;}).join('');
  box.querySelectorAll('button[data-b]').forEach(b=>b.onclick=()=>sell(+b.dataset.i,b.dataset.b));
}
function sell(i,b){
  const it=S.inv[i];if(!it)return;const I=ITEMS[it.k];
  if(b==='toss'){S.inv.splice(i,1);renderStorage();return;}
  const p=I.sell[b];
  if(b==='momo'){S.momo.xp+=p;toast(`모모가 ${I.n}을(를) 먹었다. 냠.`,'ok');if(S.momo.lv<2&&S.momo.xp>=3){S.momo.lv=2;S.contam=Math.max(0,S.contam-15);setTimeout(()=>toast('모모가 기운을 차렸다! 모모의 코 2회 · 오염 −15','ok'),900);}}
  else{S.money+=p;snd('coin');toast(`${I.n} → +${p}G`,'ok');}
  if(b==='enoch'&&I.contra)S.enoch++;
  if(b==='dora'&&it.k==='spore'&&it.rev){S.contam=Math.min(100,S.contam+3);setTimeout(()=>toast('포자 버섯이 시장에 풀렸다 · 오염 +3','bad'),700);}
  if(b==='helga'&&!S.cooked){S.cooked=true;const had=Object.keys(S.rels).length;S.rels={};setTimeout(()=>toast(had?'헬가의 던전밥 — 단골들의 서운함이 풀렸다':'헬가의 던전밥 — 다들 배불리 먹었다','ok'),800);}
  S.inv.splice(i,1);renderStorage();renderMomo();renderInvest();renderRent();hud();
  if(S.contam>=100)gameOver('door');
}
function renderMomo(){
  const need=S.momo.lv>=2?'':`다음 단계까지 ${Math.max(0,3-S.momo.xp)}`;
  $('momoBox').innerHTML=`<div class="momoBox"><div class="pp"><svg width="80" height="96" viewBox="0 0 100 120">${momoSvg(S.momo.lv)}</svg></div><div><b>모모 Lv${S.momo.lv}</b><div class="momoSub">모모의 코 밤마다 ${S.momo.lv}회<br>${need}</div><div class="xp"><i style="width:${S.momo.lv>=2?100:Math.min(100,S.momo.xp/3*100)}%"></i></div></div></div>`;
}
function renderInvest(){
  const opts=[['iso','격리실 +1칸',15,4,`지금 ${S.caps.iso}칸 (초과 시 호송 ${COST.iso}G)`],['bed','치료소 침대 +1',10,4,`지금 ${S.caps.bed}개 (초과 시 ${COST.bed}G)`],['time','야간 근무 +20초',10,2,`연장 ${S.caps.time}회`],['oil','등불 기름 +20초',8,3,`지금 ${oilMax()}초`]];
  $('invest').innerHTML=opts.map(([k,lb,cost,max,now])=>`<button data-k="${k}" data-c="${cost}" ${S.money<cost||S.caps[k]>=max?'disabled':''}>${lb} · ${cost}G<br><small>${now}${S.caps[k]>=max?' (최대)':''}</small></button>`).join('');
  $('invest').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,c=+b.dataset.c;if(S.money<c)return;S.money-=c;S.caps[k]++;snd('coin');toast('투자 완료','ok');renderInvest();renderRent();hud();});
}
function toNight(){
  if(S.day===RENT_DAY){if(S.money<RENT){gameOver('shut');return;}S.money-=RENT;hud();weekEnd();return;}
  S.day++;S.cooked=false;S.newRules=[];
  NEWRULES[S.day].forEach(n=>{if(!S.rules.includes(n)){S.rules.push(n);S.newRules.push(n);}});
  S.rules.sort((a,b)=>a-b);
  startNight();
}
function weekEnd(){
  const L=S.log,c=k=>L.filter(x=>x.st===k).length,acc=L.filter(x=>x.grade==='bad').length;
  const m=L.find(x=>x.d===4&&x.id==='4-3');
  const ten={pass:'13번 줄 옆에 누군가 작게 적어 두었다. "고마워."',iso:'13번 줄은 밤사이 번져서, 이제 읽을 수 없다.',treat:'13번 줄 아래에 한 줄이 더 늘어 있었다. "14. ………"'}[m?m.v:'']||'13번 줄은 그대로다.';
  ov(`<h2>주말 정산 · 1주 차 끝</h2>
   <p>운영비 ${RENT}G를 냈다. 남은 자금 <b>${S.money}G</b>, 오염 <b>${S.contam}</b>/100, 모모 Lv${S.momo.lv}.</p>
   <div class="sum"><div><b>${L.length}</b>판정</div><div><b>${c('ok')}</b>수칙대로</div><div><b>${c('bad')}</b>위반</div><div><b>${c('q')}</b>직접 판단</div><div><b>${acc}</b>사고</div><div><b>${S.enoch}</b>에녹에게 판 파편</div></div>
   <h3 class="secH">수칙집을 다시 펼쳤다</h3>${ruleLines([12,13])}
   <p>12번은 당신이 썼다. 13번을 쓴 기억은 없다. <b>필체는 당신 것과 똑같다.</b> 단골 카드의 메모와도. ${ten}</p>
   ${S.enoch?`<p>에녹의 표본 상자에 붉은 조각이 ${S.enoch}개 들어갔다. "다음 주에도 부탁드립니다."</p>`:''}
   <div class="paper"><b>[왕립 경계청 공문]</b> 다음 주부터 13번 출입구의 <b>입장 심사권</b>을 등불 길드에 위임한다. — 감찰관 케인<br><span style="font-size:13px">(정식 제작: 2장 진입편 — 출발할 때 부절을 쪼개 주고, 돌아올 때 맞춘다. 그리고 3장 거울 숲.)</span></div>
   <h3 class="secH">재미 체크</h3>
   <div class="q">재미있었나요? ${[1,2,3,4,5].map(n=>`<label><input type="radio" name="fun" value="${n}"> ${n}</label>`).join('')}</div>
   <div class="q">끌린 것 (여러 개)<br>${['어두운 창구와 등불·돋보기','카드의 작은 특징 찾기','아침에 알게 되는 결과','인식표·부절·짝방울','암구호·추궁','매입 딜레마','아침 사무소','수칙 쓰기 / 이상한 수칙'].map(x=>`<label><input type="checkbox" name="pick" value="${x}"> ${x}</label>`).join('')}</div>
   <div class="q">가장 재미있던 순간<textarea id="best"></textarea></div>
   <div class="q">지루하거나 헷갈렸던 점<textarea id="worst"></textarea></div>
   <button class="primary" id="saveBtn">저장</button> <button class="primary ghost" onclick="location.reload()">처음부터 다시</button>`);
  $('saveBtn').onclick=()=>{const v=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value||'';const picks=[...document.querySelectorAll('input[name=pick]:checked')].map(x=>x.value).join(', ');
    try{const a=JSON.parse(localStorage.getItem('srg_toys')||'{}');a.proto4={fun:v('fun'),best:(picks?'['+picks+'] ':'')+$('best').value,worst:$('worst').value,score:{n:L.length,ok:c('ok'),bad:c('bad'),acc,money:S.money,contam:S.contam,enoch:S.enoch,rule12:S.playerRule},at:new Date().toISOString()};localStorage.setItem('srg_toys',JSON.stringify(a));}catch(e){}
    $('saveBtn').textContent='저장했습니다';$('saveBtn').disabled=true;};
}

// ───────── 입력 ─────────
addEventListener('keydown',e=>{
  if(!$('ov').hidden||!V||!$('office').hidden)return;
  const CODE={KeyQ:'q',KeyA:'a',KeyS:'s',KeyB:'b',KeyE:'e',KeyW:'w',KeyR:'r',KeyT:'t',KeyX:'x',KeyF:'f',KeyG:'g',Digit1:'1',Digit2:'2',Digit3:'3',Numpad1:'1',Numpad2:'2',Numpad3:'3'};
  const k=CODE[e.code]||e.key.toLowerCase();
  if(V.state==='trade'){if(k==='1')tradeAct('buy');else if(k==='2')tradeAct('no');else if(k==='3')tradeAct('conf');return;}
  if(e.code==='Space'){e.preventDefault();openS();}
  else if(k==='x')ignoreS();
  else if(k==='f')flipTag();else if(k==='g')joinTally();
  else if(['q','a','s','b','e','w','r','t'].includes(k))useTool({q:'pw',a:'chat',s:'press',b:'bell',e:'peek',w:'back',r:'lamp',t:'nose'}[k]);
  else if(k==='1')decide('pass');else if(k==='2')decide('treat');else if(k==='3')decide('iso');
});
$('shutter').onclick=()=>{if(V&&V.state==='knock')openS();};
$('tabBook').onclick=()=>drawer('book');$('tabDep').onclick=()=>drawer('dep');$('mback').onclick=()=>drawer(null);
$('reg').onclick=e=>{if(e.target.closest('#wallBell'))return;if(!$('reg').classList.contains('isEmpty'))$('reg').classList.toggle('full');};
S.rules=[...NEWRULES[0]];startNight();
window.__p={jump:d=>{S.day=d;S.rules=[];for(let i=0;i<=d;i++)NEWRULES[i].forEach(n=>S.rules.push(n));if(d>=2)S.rules.push(8);S.rules.sort((a,b)=>a-b);S.newRules=[];if(d>=4)S.playerRule='treat';startNight();},get S(){return S},get V(){return V},expect:()=>V&&V.cur&&expect(V.cur),openS,ignoreS,useTool,decide,tradeAct,sell,toNight,gameOver,flipTag,joinTally,get snap(){return SNAP},fig,setT:v=>{V.t=v}};
</script>
