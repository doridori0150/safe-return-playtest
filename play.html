<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>무사귀환 · 프로토 v5</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#18110d;--panel:#2a1d14;--panel2:#33241a;--line:#4a3424;--paper:#eadfc6;--paper2:#d8c8a6;--paper-ink:#3b2f27;--pmute:#7a6b58;--gold:#d9b46c;--brass:#cda65f;--brass2:#9c7a3c;--brass-hi:#f0d492;--ol:#382c2b;--ink:#f2e8d4;--mute:#bfae90;--red:#b0402f;--green:#4f8a5a;--teal:#2f7a80;--inkred:#a8322a;--inkblue:#2f4f9a;--drop:0 10px 22px #0008;--kr:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mag:"Gowun Batang","AppleMyungjo","Batang",serif;--ari:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--mono:"Nanum Gothic Coding",monospace;
 --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .26  0 0 0 0 .16  0 0 0 .38 -.15'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='.4 .4 .4 0 -.1  .4 .4 .4 0 -.1  .4 .4 .4 0 -.1  0 0 0 0 1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 --wood:repeating-linear-gradient(180deg,#0000 0 11px,#0000001c 11px 12px,#0000 12px 23px,#ffffff09 23px 24px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:repeating-linear-gradient(90deg,#0000 0 139px,#00000066 139px 141px,#ffffff07 141px 142px),linear-gradient(180deg,#241913,#18110d 60%,#130d0a);color:var(--ink);font-family:var(--kr);min-width:1100px;overflow:hidden}
button{font-family:var(--kr);touch-action:manipulation}
/* 상단 HUD: 나무 간판 + 명판 */
header{display:flex;align-items:center;gap:8px;padding:0 14px;height:52px;white-space:nowrap;position:relative;z-index:10;background:var(--wood),linear-gradient(#58392a,#402a1c);border-bottom:3px solid var(--ol);box-shadow:inset 0 2px 0 #7a5638,0 4px 0 #0006}
header h1{flex:none;font-size:19px;font-weight:900;color:var(--brass-hi);text-shadow:0 2px 0 var(--ol);margin-right:4px}
header h1 small{font-size:11.5px;font-weight:800;margin-left:8px;color:var(--ol);background:var(--brass);border:2px solid var(--ol);border-radius:4px;padding:1px 6px;text-shadow:none;vertical-align:3px}
.sp{flex:1}
.stat{font-size:12px;color:#dcc6a0;display:flex;align-items:center;gap:5px;height:32px;padding:0 9px;background:#221710;border:2px solid var(--ol);border-radius:6px;box-shadow:inset 0 2px 0 #0007,0 1px 0 #7a5638}
.stat b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.gold b{color:var(--brass-hi)}.stat.r b{color:#f19a8b}
.hi{display:inline-flex;line-height:0}.hi:empty{display:none}
.gauge{display:inline-block;position:relative;width:100px;height:13px;background:#0e0a07;border-radius:7px;overflow:hidden;border:2px solid var(--ol);box-shadow:inset 0 2px 3px #000c}
.gauge::after{content:"";position:absolute;left:5px;right:5px;top:2px;height:2px;border-radius:2px;background:#ffffff30}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a5ec9,#c9493a);box-shadow:inset 0 -3px 0 #0003;transition:width 1.2s ease}
#snd,#flt{background:linear-gradient(#f3d995,#d4ae62);border:2px solid var(--ol);color:var(--ol);font-weight:800;font-size:12px;border-radius:6px;padding:4px 9px;cursor:pointer;box-shadow:0 2px 0 var(--ol)}
#snd:active,#flt:active{transform:translateY(2px);box-shadow:none}
#snd.off,#flt.off{background:#3a2a1f;color:#bfae90}
.momoMini{width:26px;height:31px;display:inline-block;line-height:0}.momoMini svg{width:26px;height:31px}
/* 밤: 창구 */
main.night{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(280px,340px);gap:14px;padding:12px 14px;height:calc(100vh - 52px)}
.left{display:flex;flex-direction:column;gap:12px;min-height:0}
.reg{background:var(--tex),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:6px;padding:11px 12px 10px;flex:none;position:relative;box-shadow:0 4px 0 var(--ol),var(--drop)}
.reg::before{content:"";position:absolute;right:46px;top:-10px;width:11px;height:30px;border:2.5px solid #9aa0a8;border-radius:6px;box-shadow:0 0 0 1.5px var(--ol),inset 0 0 0 1.5px var(--ol);pointer-events:none}
.reg h3,.dep h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--pmute);margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px dashed #b9a57f}
.reg .top{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start}
.reg .ph{width:104px;height:125px;background:#d9c7a0;border:4px solid #f7f1e3;box-shadow:0 0 0 2px var(--ol),0 3px 0 2px var(--ol);border-radius:2px;overflow:hidden;line-height:0;transform:rotate(-1.5deg)}
.reg .ph svg{width:100%;height:100%}
.reg .nm{font-size:19px;font-weight:900;color:var(--ol)}.reg .rc{font-size:12px;color:var(--pmute);margin-bottom:4px}
.cardRow{display:grid;grid-template-columns:40px 1fr;font-size:13px;padding:1px 0;line-height:1.5}
.cardRow>span:first-child{color:var(--pmute)}
.cardRow .no{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.05em}
.knotSw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--ol)}
.eyeSw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--ol)}
.reg .fl{font-size:13px;border-top:1.5px dashed #b9a57f;padding-top:6px;margin-top:7px}
.reg .memo{font-family:var(--ari);color:var(--inkblue);font-size:14px;line-height:1.5;margin-top:4px}
.reg .empty{height:250px;display:grid;place-items:center;color:#8a7c66;font-size:14px;text-align:center;line-height:1.7}
.wallBell{position:absolute;right:10px;top:8px;line-height:0;transform-origin:50% 0}
.wallBell.ring,.bellMark.ring{animation:ring .45s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(20deg)}75%{transform:rotate(-20deg)}}
.stampMark{position:absolute;right:12px;top:36px;transform:rotate(12deg);border:3px solid var(--inkred);color:var(--inkred);font-weight:900;padding:2px 8px;border-radius:6px;font-size:14px;background:#eadfc6cc}
.dep{background:var(--tex),linear-gradient(90deg,#0000 24px,#c0504070 24px 25.5px,#0000 25.5px),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:6px;padding:10px 12px 10px 32px;flex:1;min-height:0;overflow:auto;box-shadow:0 4px 0 var(--ol),var(--drop)}
.dep .cnt{font-size:13px;color:var(--pmute);margin-bottom:4px}.dep .cnt b{color:var(--ol)}.dep .cnt.over b{color:var(--inkred)}
.dep .row{display:grid;grid-template-columns:62px 1fr 64px;font-size:13px;padding:4px 2px;border-bottom:1px solid #c9b996;color:var(--paper-ink)}
.dep .row .flc{color:#9a8b72}
.dep .row .st{text-align:right;color:#9a8b72}.dep .row.back .st{color:var(--inkblue);font-family:var(--ari);font-size:14px}
.dep .row.now{background:linear-gradient(transparent 52%,#f2c14e80 52%)}.dep .row.now .st{color:#8a5a14;font-weight:800}
.dep .row.x,.dep .row.x .st{color:var(--inkred)}
.dep .sulk{color:var(--inkred);font-size:11px;margin-left:3px}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.win{position:relative;flex:1;overflow:hidden;border:10px solid #4a3222;border-bottom:0;border-radius:8px 8px 0 0;background:radial-gradient(circle at 22% 8%,#ffb45a2e,transparent 36%),linear-gradient(#1d1a17,#0a0908);box-shadow:inset 0 0 0 2.5px var(--ol),0 0 0 2.5px var(--ol)}
.win .door{position:absolute;left:7%;top:20%;width:15%;height:80%;background:#00000055;border:2px solid #ffffff0a;border-bottom:0}.win .door.r{left:auto;right:7%}
.win .lampL{position:absolute;left:21%;top:3%;width:14px;height:20px;background:#ffcf6a;border-radius:3px;box-shadow:0 0 34px 12px #ffb45a50}
.win .vig{position:absolute;inset:0;box-shadow:inset 0 0 140px #000;pointer-events:none;z-index:4}
.win .wall{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 58%,#b98a58 0%,#7a522e 35%,#3a2616 62%,transparent 85%);opacity:0;transition:opacity .3s;z-index:1}
.win.lit .wall{opacity:1}
.person{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:2;line-height:0}
.person svg,.shadow svg{height:min(50vh,330px);width:auto}
.shadow{position:absolute;bottom:0;left:50%;z-index:1;line-height:0;filter:brightness(0) blur(1px);opacity:.72;transform:translateX(-50%) translate(-150px,-34px) scale(.96) skewX(-8deg);display:none}
.shadow.s2{transform:translateX(-50%) translate(150px,-30px) scale(.96) skewX(8deg)}
.win.lit .shadow{display:block}
.bellMark{position:absolute;z-index:3;left:calc(50% - 118px);bottom:22px;line-height:0;transform-origin:50% 0}
.tray{position:absolute;right:16px;bottom:12px;z-index:6;background:var(--tex),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 3px 0 var(--ol),0 8px 18px #0008;transform:rotate(-2deg)}
.tray b{font-size:16px;color:var(--ol)}.tray small{display:block;color:var(--pmute);font-size:12px}
/* 말풍선: 그림과 같은 윤곽선 */
.bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fbf6ea;color:var(--ol);padding:10px 18px;border:2.5px solid var(--ol);border-radius:14px;box-shadow:0 3px 0 var(--ol);font-size:16px;font-weight:500;max-width:86%;text-align:center;z-index:6;line-height:1.5}
.bubble::before{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ol);border-bottom:0}
.bubble::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7.5px solid transparent;border-top-color:#fbf6ea;border-bottom:0}
.bubble.sys{background:#120d0acc;color:#e0d3bb;font-style:italic;border-color:#0009;box-shadow:none}.bubble.sys::before,.bubble.sys::after{display:none}
.bubble .qq{display:block;font-size:12.5px;color:var(--pmute);margin-bottom:2px}
.bubble.momo{background:#e3f0cc;color:#23401b;top:auto;bottom:18px;left:18px;transform:none;max-width:52%;text-align:left}
.bubble.momo::before,.bubble.momo::after{display:none}
.shutter{position:absolute;inset:0;z-index:5;background:repeating-linear-gradient(180deg,#50545b 0 3px,#3f4248 3px 18px,#2b2d31 18px 20px,#1d1e21 20px 23px);transition:transform .42s cubic-bezier(.55,0,.3,1);display:grid;place-items:center;cursor:pointer}
.shutter.up{transform:translateY(-101%)}.shutter.slam{transition:transform .12s ease-in}
.knock{font-size:46px;font-weight:900;color:#ffffff40;letter-spacing:.35em;min-height:60px}
.knock span{display:inline-block;animation:kn .35s ease-out}
@keyframes kn{0%{transform:scale(1.6);color:#ffffffbb}100%{transform:scale(1)}}
.shutter .hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#ffffff66;font-size:13px}
.stamp{position:absolute;top:42%;left:50%;z-index:6;border:5px solid;padding:4px 20px;font-size:40px;font-weight:900;letter-spacing:.08em;border-radius:8px;transform:translate(-50%,-50%) rotate(-10deg);animation:st .22s ease-out;background:#00000030}
@keyframes st{0%{transform:translate(-50%,-50%) rotate(-10deg) scale(2);opacity:0}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.stamp.pass{color:#8fd6a3;border-color:#8fd6a3}.stamp.treat{color:#7fd0c8;border-color:#7fd0c8}.stamp.iso{color:#ff8a78;border-color:#ff8a78}
.cost{position:absolute;left:50%;top:40%;z-index:7;color:#ffd48a;font-weight:800;font-size:18px;animation:up 1s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
/* 창구 책상: 서류 */
.counter{flex:none;height:132px;background:var(--wood),linear-gradient(#654530,#523926);border-top:3px solid var(--ol);box-shadow:inset 0 3px 0 #8a6040;display:flex;gap:22px;align-items:center;justify-content:center;padding:6px 16px}
.counter .none{color:#eed9b4cc;font-size:14px}
.docLbl{font-size:11.5px;color:#f3e2c2;letter-spacing:.04em;margin-bottom:4px;display:flex;justify-content:space-between;text-shadow:0 1px 0 #0006}
.docLbl kbd{font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--ol);color:var(--brass-hi);border-radius:3px;padding:0 4px;margin-left:3px;text-shadow:none}
.tagWrap{perspective:700px;width:200px;height:96px;cursor:pointer}
.tag{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tag.flip{transform:rotateY(180deg)}
.tagF,.tagB{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(135deg,#e4e8ec,#a3abb5 55%,#cfd4da);border:2.5px solid var(--ol);box-shadow:inset 0 1px 0 #fff8,0 3px 0 var(--ol),0 6px 10px #0006;color:#2a2f36;padding:7px 10px 7px 28px;overflow:hidden}
.tagB{transform:rotateY(180deg);display:flex;align-items:center;justify-content:space-around}
.hole{position:absolute;left:9px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#3a2a1e;box-shadow:inset 0 1px 2px #000}
.tag .tn{font-weight:800;font-size:15px;line-height:1.3}.tag .tr{font-size:11px;color:#4a525c}
.tag .no{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.1em;margin-top:1px}
.tag .knot{position:absolute;right:8px;top:6px;text-align:center;font-size:10px;font-weight:800;color:#2a2f36;line-height:1}
.tag .scr{position:absolute;inset:0;pointer-events:none}
.tallyBox{cursor:pointer;line-height:0}
.tallyBox g.ret{transition:transform .45s ease}
.tlab{display:flex;justify-content:space-between;width:330px;font-size:11px;color:#f3e2c2;margin-top:2px}
/* 책상 아래칸: 도구 패 + 고무도장 */
.desk{height:96px;flex:none;background:var(--wood),linear-gradient(#4a3222,#3b2819);border-top:3px solid var(--ol);border-radius:0 0 8px 8px;box-shadow:0 0 0 2.5px var(--ol);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px}
.desk button{position:relative;font-weight:800;border:2.5px solid var(--ol);border-radius:7px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 var(--ol);transition:transform .06s,box-shadow .06s}
.desk button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.desk button:disabled{opacity:.42;cursor:default;box-shadow:0 1px 0 var(--ol);transform:translateY(3px)}
.desk kbd{font-family:var(--mono);font-size:10.5px;font-weight:700;margin-left:6px;background:var(--ol);color:var(--brass-hi);border-radius:3px;padding:1px 4px;vertical-align:1px;text-shadow:none}
.big{font-size:17px;padding:12px 18px}
.tools{display:grid;grid-template-columns:repeat(4,auto);gap:8px 6px}
.tools button{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;padding:5px 7px 5px 6px;border-width:2px;background:linear-gradient(#f3e7c9,#e3cfa4);color:var(--ol);box-shadow:0 3px 0 var(--ol)}
.tools button .ti{display:inline-flex;line-height:0}
.tools button.on{background:linear-gradient(#ffe7a3,#f2c14e);box-shadow:0 3px 0 var(--ol),0 0 16px #f2c14e99}
.tools kbd{margin-left:3px}
.desk .stampB{margin-top:10px}
.desk .stampB::before{content:"";position:absolute;left:50%;top:-13px;width:40px;height:11px;margin-left:-20px;background:linear-gradient(#94694a,#6a4a30);border:2.5px solid var(--ol);border-bottom:0;border-radius:10px 10px 0 0}
.b-open{background:linear-gradient(#f3d995,#d4ae62);color:var(--ol)}.b-ign{background:#2c2019;color:#e7dcc0}
.b-pass,.b-treat,.b-iso,.b-conf{color:#fff8e6;text-shadow:0 2px 0 #0005}
.b-pass{background:linear-gradient(#5f9d6a,#4a8456)}.b-treat{background:linear-gradient(#3d8e94,#2d747a)}.b-iso{background:linear-gradient(#c5533e,#a83e2d)}
.b-buy{background:linear-gradient(#f3d995,#d4ae62);color:var(--ol)}.b-no{background:#2c2019;color:#f2e8d4}.b-conf{background:linear-gradient(#7d4d8c,#63386f)}
.vb small{display:block;font-size:11px;font-weight:700;opacity:.92}
.vb.over small{color:#ffe0a0}
.sep{width:2px;height:58px;background:#0006;box-shadow:1px 0 0 #ffffff14;margin:0 4px}
.tradeLbl{color:#f3e2c2;font-size:14px;margin-right:6px;text-align:right}.tradeLbl b{font-size:16px}
/* 수칙집: 제본된 책 한 쪽 */
.book{position:relative;background:var(--tex),linear-gradient(90deg,#0000003d,#0000 20px),repeating-linear-gradient(180deg,transparent 0 35px,#c9b99666 35px 36px),var(--paper);color:var(--paper-ink);border:2.5px solid var(--ol);border-radius:4px 8px 8px 4px;padding:14px 16px 12px 22px;overflow:auto;box-shadow:0 4px 0 var(--ol),var(--drop)}
.book::before{content:"";position:absolute;top:0;right:18px;width:14px;height:44px;background:var(--inkred);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.book h2{font-size:17px;font-weight:900;color:var(--ol);padding-right:30px}.book .by{font-family:var(--mag);font-size:14px;color:#6e2a1c;margin:2px 0 8px}
.pwBox{position:relative;background:#f6e7a6;color:var(--ol);border:2px solid var(--ol);border-radius:3px;padding:9px 12px;margin:8px 0 10px;font-size:13.5px;line-height:1.6;box-shadow:0 3px 0 var(--ol);transform:rotate(-.6deg)}
.pwBox::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#c9493a;border:2px solid var(--ol)}
.pwBox b{color:var(--inkred)}
.ref{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--pmute);margin-bottom:10px;background:#e2d4b4aa;border:1.5px dashed #a8946c;border-radius:6px;padding:6px 8px;line-height:1.5}
.book ol{list-style:none}
.book li{display:grid;grid-template-columns:22px 1fr;gap:4px;margin-bottom:9px;line-height:1.5;position:relative;border-radius:4px}
.book li .n{font-weight:800;font-size:14px;color:var(--pmute);padding-top:1px}
.ink-m{font-family:var(--mag);font-size:15.5px;color:#6e2a1c;line-height:1.55}
.ink-k{font-family:var(--mono);font-size:13.5px;color:#222;line-height:1.55;letter-spacing:-.02em}
.ink-a{font-family:var(--ari);font-size:15.5px;color:var(--inkblue);line-height:1.55}
.book li.red .ink-m{color:#b3261e}.book li.red{border-left:4px solid #b3261e;padding-left:4px}
.book li.new::after{content:"새 줄";position:absolute;right:-4px;top:-8px;font-size:10.5px;font-weight:900;color:var(--inkred);background:#eadfc6;border:2px solid var(--inkred);padding:0 4px;border-radius:4px;transform:rotate(8deg);font-family:var(--kr)}
.book li.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%{background:#ffd48a}100%{background:transparent}}
.toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);padding:9px 18px;border-radius:6px;font-weight:700;z-index:40;font-size:15px;max-width:780px;text-align:center;background:var(--tex),var(--paper);color:var(--ol);border:2.5px solid var(--ol);border-left-width:9px;box-shadow:0 3px 0 var(--ol),0 10px 20px #0008}
.toast.ok{border-left-color:#4a8456}.toast.bad{border-left-color:var(--inkred)}.toast.q{border-left-color:#5a4a8a}.toast.info{border-left-color:var(--brass2)}

/* 아날로그 필터: 입자·색감·비네트. 돋보기 자리는 뚫는다 */
.film{position:fixed;inset:0;pointer-events:none;z-index:95;-webkit-mask-image:radial-gradient(circle at var(--lx,-600px) var(--ly,-600px),#0000 var(--lr,0px),#000 calc(var(--lr,0px) + 3px));mask-image:radial-gradient(circle at var(--lx,-600px) var(--ly,-600px),#0000 var(--lr,0px),#000 calc(var(--lr,0px) + 3px))}
.film-grain{background-image:var(--grain);mix-blend-mode:overlay;opacity:.42;animation:grain .5s steps(1) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-37px 51px}50%{background-position:63px -18px}75%{background-position:-12px -77px}100%{background-position:29px 88px}}
.film-tone{background:#ffae5c;mix-blend-mode:soft-light;opacity:.13}
.film-lift{background:#1c120c;mix-blend-mode:lighten;opacity:.38}
.film-vig{background:radial-gradient(ellipse 85% 80% at 50% 46%,#0000 58%,#0a0503a8 100%);animation:vflk 2.4s steps(1) infinite}
@keyframes vflk{0%{opacity:1}30%{opacity:.93}55%{opacity:1}80%{opacity:.96}}
.overlay:not([hidden])~.film-grain{opacity:.28}
body.nofilm .film{display:none}
@media (prefers-reduced-motion:reduce){.film-grain,.film-vig{animation:none}}

// ───────── 소리 ─────────
function snd(k){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime,g=AC.createGain();g.connect(AC.destination);
  const osc=(type,f,a,dur,to=g,st=0)=>{const o=AC.createOscillator();o.type=type;o.frequency.value=f;const gg=AC.createGain();gg.gain.setValueAtTime(a,t0+st);gg.gain.exponentialRampToValueAtTime(.0005,t0+st+dur);o.connect(gg);gg.connect(to);o.start(t0+st);o.stop(t0+st+dur+.02);};
  const noiseB=(len,lp,amp,st=0)=>{const b=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const gg=AC.createGain();gg.gain.value=amp;s.connect(f);f.connect(gg);gg.connect(g);s.start(t0+st);};
  if(k==='knock'){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t0);o.frequency.exponentialRampToValueAtTime(55,t0+.13);g.gain.setValueAtTime(.55,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.18);o.connect(g);o.start(t0);o.stop(t0+.2);}
  else if(k==='stamp'){osc('square',90,.2,.12);}
  else if(k==='coin'){osc('triangle',1320,.1,.2);}
  else if(k==='wood'){osc('square',220,.12,.08);osc('sine',140,.2,.12);}
  else if(k==='step'){noiseB(.09,500,.25);noiseB(.09,420,.2,.32);}
  else if(k==='creak'){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,t0);o.frequency.linearRampToValueAtTime(120,t0+.5);const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=600;const gg=AC.createGain();gg.gain.setValueAtTime(.05,t0);gg.gain.exponentialRampToValueAtTime(.001,t0+.55);o.connect(f);f.connect(gg);gg.connect(g);o.start(t0);o.stop(t0+.6);}
  else if(k==='snore'){[0,1.1].forEach(st=>noiseB(.7,260,.35,st));}
  else if(k==='hum'){[392,440,494,440].forEach((f,i)=>osc('sine',f,.05,.3,g,i*.32));}
  else if(k==='humBad'){[392,415,470,430].forEach((f,i)=>osc('sine',f*(i%2?1.06:.97),.05,.3,g,i*.32));}
  else if(k==='scratch'){for(let i=0;i<5;i++)noiseB(.06,2400,.12,i*.13);}
  else if(k==='shutter'){noiseB(.38,900,.16);}
  else if(k==='bubble'){for(let i=0;i<6;i++)osc('sine',300+rnd()*400,.05,.12,g,i*.12);}
  else if(k==='eerie'){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.12,t0+.3);g.gain.exponentialRampToValueAtTime(.001,t0+1.5);[220,233.1].forEach(fq=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=fq;o.connect(g);o.start(t0);o.stop(t0+1.5);});}
}catch(e){}}
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
addEventListener('pointerdown',unlockAudio);addEventListener('keydown',unlockAudio);

const JO={'이(가)':['이','가'],'을(를)':['을','를'],'은(는)':['은','는'],'과(와)':['과','와']};
function josa(t){return String(t).replace(/([가-힣])(이\(가\)|을\(를\)|은\(는\)|과\(와\))/g,(m,ch,j)=>ch+JO[j][(ch.charCodeAt(0)-0xAC00)%28?0:1]);}
function toast(msg,k='info'){msg=josa(msg);const d=document.createElement('div');d.className='toast '+k;d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
function loupeHole(on){const r=document.documentElement.style;if(!on){r.setProperty('--lr','0px');return;}const b=$('loupe').getBoundingClientRect();r.setProperty('--lx',(b.left+b.width/2)+'px');r.setProperty('--ly',(b.top+b.height/2)+'px');r.setProperty('--lr',(b.width/2-3)+'px');}
function ov(html,cls=''){html=josa(html);loupeHole(false);$('ovCard').className='card'+(cls?' '+cls:'');document.querySelectorAll('.toast').forEach(x=>x.remove());$('ovCard').innerHTML=html;$('ov').hidden=false;$('ovCard').scrollTop=0;}
function closeOv(){$('ov').hidden=true;}
const docHead=(l,r)=>`<div class="docHead"><span>${l}</span><span>${r}</span></div>`;
const STAGES={morning:'아침',window:'저녁 · 창구',dinner:'저녁 식당',patrol:'새벽 순찰'};
let STAGE='morning';
function show(stage){STAGE=stage;['morning','window','dinner','patrol'].forEach(s=>$('m_'+s).hidden=s!==stage);hud();}

  $('hStage').textContent=S.day>=DAYS_N?'결산':STAGES[STAGE];$('hDay').textContent=S.day>=DAYS_N?'주말':`${S.day+1}일째`;
  const night=STAGE!=='morning';$('hClockW').style.visibility=night&&V?'visible':'hidden';
  if(V)$('hClock').textContent=hhmm(V.clock);

let MTAB='res',MRES=null,SEND=null;
const MTABS=[['res','1 · 아침 결과'],['shop','2 · 장사'],['pot','3 · 가마솥'],['send','4 · 보내기']];
function morningStart(res){V=null;tok++;MRES=res;MTAB='res';SEND=null;SNAP.morning=JSON.stringify(S);show('morning');renderMorning();}
function renderMorning(){
  $('mNav').innerHTML=MTABS.map(([k,l])=>`<button data-t="${k}" class="${k===MTAB?'on':''}">${l}</button>`).join('');
  $('mNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{MTAB=b.dataset.t;renderMorning();});

}
const nextTab=k=>`<button class="primary mnext" id="mNext">${k} →</button>`;

// ① 아침 결과
function tabRes(){
  let h;
  if(!MRES){h=`${docHead('등불 길드 여관 · 근무 일지',`${S.day+1}일째 아침`)}<h2>문을 다시 연 여관</h2>
    <p class="lead2">13번 출입구 옆 등불 길드 여관. 아침마다 모험가를 미궁으로 <b>보내고</b>, 저녁에 돌아온 이들을 창구에서 <b>맞이해</b> 먹이고 재우고, 새벽까지 <b>지킨다</b>.</p>
    <div class="rulebox"><b>귀환은 아침에 끝난다.</b> 돌아온 사람이 제 방에서 무사히 깨어나야 <b>경계의 실</b>이 한 땀 꿰매진다. 실이 다 풀리면 여관은 미궁에 먹힌다.<br>그런데 돌아오는 것이 전부 사람은 아니다.</div>
    <ol class="flow"><li><b>장사</b> — 창고의 물건을 팔고, 기름과 빵을 산다</li><li><b>가마솥</b> — 재료 두 가지로 요리·물약·등불 기름을 만든다</li><li><b>보내기</b> — 의뢰에 단골을 보낸다. 오늘 밤 들고 갈 기름을 고른다</li><li><b>저녁 창구</b> — 돌아온 이를 살피고, 들이거나(방 배정) 돌려보낸다. 전리품을 사들인다</li><li><b>저녁 식당</b> — 한 식탁에 앉혀 먹이며 살핀다. 수상하면 방을 바꾼다</li><li><b>새벽 순찰</b> — 문마다 엿듣고 들여다보고, 잠그거나 지킨다</li></ol>`;}
  else{const d=MRES;
    h=`${docHead('등불 길드 여관 · 아침 보고서',`${S.day+1}일째 아침`)}<h2>${S.day}일째 밤이 지났다</h2>
    <div class="threadSum">경계의 실 <span class="gauge thr gw"><i style="width:${d.before/THREAD_MAX*100}%"></i></span> <b>${d.before}</b> → <b class="${S.thread<d.before?'badN':'goodN'}">${S.thread}</b> / ${THREAD_MAX}</div>
    <div class="scenes">${d.cards.map(c=>`<div class="scene ${c.cls||''}"><div class="sp">${c.fig||''}</div><div><b>${c.title}</b><p>${c.text}</p>${c.delta?`<span class="dl ${c.delta<0?'minus':'plus'}">실 ${c.delta>0?'+':''}${c.delta}</span>`:''}${c.money?`<span class="dl money">${c.money>0?'+':''}${c.money}G</span>`:''}</div></div>`).join('')}</div>
    ${d.notes.length?`<ul class="mnotes">${d.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}`;}
  $('mBody').innerHTML=`<div class="paperPage">${h}${nextTab('장사')}</div>`;bindNext('shop');
}

// ② 장사
function tabShop(){
  const items=Object.keys(S.inv).filter(k=>ITEM[k]);
  const invH=items.length?items.map(k=>{const I=ITEM[k],n=inv(k);
    const bs=[I.sell?`<button data-sell="${k}">도라에게 ${I.sell}G</button>`:'',I.enoch?`<button class="enoch" data-enoch="${k}">에녹에게 ${I.enoch}G · 실 −1</button>`:''].join('');
    return `<div class="invc"><div class="ic">${itemIcon(k,48)}</div><div><b>${I.n}</b> <span class="cnt">×${n}</span><div class="bs">${bs||'<span class="nobuy">팔 수 없다</span>'}</div></div></div>`;}).join(''):'<p class="nobuy">창고가 비었다.</p>';
  const pend=S.pending.filter(p=>p.req.need&&!p.done);
  const pendH=pend.length?pend.map((p,i)=>{const r=p.req,ok=inv(r.need)>=r.qty;
    return `<div class="reqDue"><b>${r.by}</b> — ${ITEM[r.need].n} ×${r.qty} → <b>${r.reward}G</b>${r.enoch?' <span class="badN">(실 −2)</span>':''}<br><small>창고 ${inv(r.need)}개</small> <button data-deliver="${S.pending.indexOf(p)}" ${ok?'':'disabled'}>납품</button></div>`;}).join(''):'<p class="nobuy">납품할 의뢰가 없다.</p>';
  const hurt=REG_IDS.filter(id=>alive(id)&&S.regs[id].hurt);
  $('mBody').innerHTML=`<div class="shopGrid">
   <section class="ocol"><h3>창고</h3><div class="invGrid">${invH}</div></section>
   <section class="ocol"><h3>의뢰 납품</h3>${pendH}
     <h3 style="margin-top:16px">도라의 가게</h3>
     <div class="buyRow"><span>${itemIcon('oil',36)} 등불 기름 한 병 (${OIL_SEC}초)</span><button data-buy="oil" ${S.money<COST.oil?'disabled':''}>${COST.oil}G</button></div>
     <div class="buyRow"><span>${itemIcon('bread',36)} 빵</span><button data-buy="bread" ${S.money<COST.bread?'disabled':''}>${COST.bread}G</button></div>
     ${S.stained.map(r=>`<div class="buyRow"><span>${r}호 얼룩 수선 <small class="badN">(못 쓰는 방)</small></span><button data-repair="${r}" ${S.money<COST.repair?'disabled':''}>${COST.repair}G</button></div>`).join('')}
   </section>
   <section class="ocol"><h3>다친 단골</h3>${hurt.length?hurt.map(id=>`<div class="buyRow"><span><b>${C[id].name}</b> — ${S.regs[id].hurt==='sand'?'붉은 모래 눈':'이끼 번짐'} (파견 불가)</span><button data-heal="${id}" ${inv('heal')?'':'disabled'}>치료약</button></div>`).join(''):'<p class="nobuy">없다.</p>'}
     <div class="rent">주말(3일째 밤이 지난 아침) 운영비 <b>${RENT}G</b>. 현재 <b>${S.money}G</b>.</div>${nextTab('가마솥')}</section></div>`;
  const B=$('mBody');
  B.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const k=b.dataset.sell;addInv(k,-1);S.money+=ITEM[k].sell;if(k==='mush'&&S.sporeHidden>inv('mush'))S.sporeHidden=inv('mush');snd('coin');renderMorning();});
  B.querySelectorAll('[data-enoch]').forEach(b=>b.onclick=()=>{const k=b.dataset.enoch;addInv(k,-1);S.money+=ITEM[k].enoch;S.thread--;clampThread();snd('coin');toast('에녹: "좋은 표본이군요." — 경계의 실이 한 올 풀렸다','bad');renderMorning();if(S.thread<=0)gameOver('thread');});
  B.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>{const p=S.pending[+b.dataset.deliver],r=p.req;addInv(r.need,-r.qty);S.money+=r.reward;p.done=true;if(r.enoch){S.thread-=2;clampThread();toast('에녹에게 붉은 모래를 넘겼다. 실이 두 올 풀렸다','bad');}else toast(`${r.by} 의뢰 완료 +${r.reward}G`,'ok');snd('coin');renderMorning();if(S.thread<=0)gameOver('thread');});

function partyRisk(req,mem,p){if(!mem.length)return null;let r=FLOOR[req.fl].risk+(req.risky?1:0);r-=mem.reduce((a,id)=>a+REG[id].apt[req.fl],0)/mem.length;

  const roster=REG_IDS.map(id=>{const R=S.regs[id],st=R.gone?(R.gone==='missing'?'실종':'떠남'):R.hurt?'부상':used.includes(id)?'배정':'대기';
    return `<div class="rost ${R.gone?'gone':''}"><div class="pp">${R.gone?'':svg(fig(id),40)}</div><div><b>${C[id].name}</b> <small>${REG[id].role}</small><br><small>B1 ${'●'.repeat(REG[id].apt.B1+1)}${'○'.repeat(1-REG[id].apt.B1)} · B2 ${'●'.repeat(REG[id].apt.B2+1)}${'○'.repeat(1-REG[id].apt.B2)} · 원망 ${R.grudge}</small></div><span class="st ${st}">${st}</span></div>`;}).join('');
  const oils=Object.keys(OILS).filter(k=>inv(k)>0);if(!oils.includes(S.oilPick))S.oilPick=oils[0]||null;

function depart(){
  const out=[];
  SEND.forEach(p=>{if(!p.mem.length)return;const r=partyRisk(p.req,p.mem,p);
    if(p.lunch)addInv('lunch',-1);if(p.recall)addInv('recall',-1);
    const loot=[];if(p.req.need)for(let i=0;i<p.req.qty;i++)loot.push(p.req.need);
    const extra=1+(r>=1?1:0);for(let i=0;i<extra;i++)loot.push(pick(FLOOR[p.req.fl].loot));
    const hurt={};p.mem.forEach(id=>{if(!p.recall&&(REG[id].apt[p.req.fl]<0||r>=2)&&rnd()<.55)hurt[id]=p.req.fl==='B2'?'sand':'moss';});
    out.push({req:p.req,mem:p.mem.slice(),risk:r,loot,hurt,recall:p.recall,lunch:p.lunch});});
  S.sent=out;S.pending=S.pending.filter(p=>!p.done&&p.req.need).concat(out.map(x=>({req:x.req,done:false,party:true})));
  eveningStart();
}

// ───────── 저녁: 창구 ─────────
const CHECKS=2;
function buildQueue(){
  const plan=DAYPLAN[S.day],parties=S.sent||[],q=[],late=[],fakes=[];
  plan.fake.forEach(f=>{
    if(f.fam==='pilgrim'){fakes.push({f,pilgrim:true});return;}
    let party=null;
    if(f.from==='risky')party=parties.find(p=>p.req.risky&&!fakes.some(x=>x.party===p));
    if(f.from==='B2')party=parties.find(p=>p.req.fl==='B2'&&!fakes.some(x=>x.party===p));
    if(!party)party=parties.filter(p=>!fakes.some(x=>x.party===p)).sort((a,b)=>b.risk-a.risk)[0];
    if(!party){const idle=REG_IDS.filter(id=>alive(id)&&!parties.some(p=>p.mem.includes(id)));fakes.push({f,uninvited:pick(idle.length?idle:REG_IDS)});return;}
    const id=party.mem.slice().sort((a,b)=>REG[a].apt[party.req.fl]-REG[b].apt[party.req.fl])[0];
    fakes.push({f,id,party});
  });
  const mk=(id,pi,p,lootKeys,extra)=>({kind:'reg',id,party:pi,partner:p?p.mem.find(x=>x!==id)||null:null,fl:p?p.req.fl:null,tally:'ok',
    loot:lootKeys.map(k=>({k,spore:k==='mush'&&rnd()<.35,seen:false})),hurt:null,fake:null,o:{},...extra});
  const guestAt=Math.min(1,parties.length);
  parties.forEach((p,pi)=>{
    if(pi===guestAt)plan.guests.forEach(g=>q.push({kind:'guest',id:g,loot:[],o:{}}));
    const lootBy=p.mem.map(()=>[]);p.loot.forEach((k,i)=>lootBy[i%p.mem.length].push(k));
    p.mem.forEach((id,mi)=>{
      const fk=fakes.find(x=>x.id===id&&x.party===p);
      if(fk){const cs=mk(id,pi,p,[fk.f.fam==='mimic'?'coin':'shadow'],{fake:fk.f});
        cs.o=fk.f.fam==='mimic'?{f:REG[id].fakeF}:{shadowShape:pick(['horns','tail','arm'])};q.push(cs);
        if(fk.f.lateReal)late.push(mk(id,pi,p,lootBy[mi],{tally:'none',late:true}));}
      else{const cs=mk(id,pi,p,lootBy[mi],{hurt:p.hurt[id]||null});if(cs.hurt)cs.o=cs.hurt==='sand'?{sandEyes:1}:{moss:1};q.push(cs);}
    });
  });
  if(parties.length<=guestAt)plan.guests.forEach(g=>q.push({kind:'guest',id:g,loot:[],o:{}}));
  fakes.filter(x=>x.uninvited).forEach(x=>q.push(mk(x.uninvited,-1,null,['coin'],{fake:x.f,tally:'none',o:{f:REG[x.uninvited].fakeF}})));
  fakes.filter(x=>x.pilgrim).forEach(x=>q.splice(Math.max(1,q.length-1),0,{kind:'guest',id:'pilgrim',loot:[],o:{},fake:x.f}));
  q.push(...late);
  if(plan.knock3)q.push({kind:'knock3',loot:[],o:{}});
  return q;
}

     lit:false,checks:0,used:{},face:false,joined:false,refused:[],admitted:[],dinner:null,patrol:null,running:false};

    if(pc)return pc.fake.fam==='mimic'?`"${C[cs.partner].name}? 굴에서 한참 안 보이다가 나타났어. 그 뒤로 말투가… 좀 이상해."`:`"${C[cs.partner].name}? 붉은 달 아래서 잠깐… 그림자가 둘이었던 것 같아. 착각이겠지."`;}
  if(cs.kind==='guest')return cs.fake?'"성지로 가는 길입니다. …그런데 이 여관엔 방이 몇 개지요? 옆방엔 누가 자나요?"':GUEST[cs.id].ask;
  if(cs.late)return '"굴에서 길을 잃었어. 부절도 떨어뜨리고… 그런데 누가 내 방에 있다고?"';
  return HAB[cs.id].ask[cs.fake&&cs.fake.fam==='mimic'?1:0];}
function note(t,cs){V.dinner.notes.unshift({who:cs?nameOf(cs):'',room:cs?cs.room:'',t});}
function watch(cs,kind){const D=V.dinner;if(!D.served){toast('먼저 음식을 내자','bad');return;}if(D.obs<=0){toast('관찰할 여유가 없다','bad');return;}
  const key=cs.room+kind;if(D.said[key]){toast('이미 본 모습이다');return;}D.said[key]=1;D.obs--;
  const t=kind==='watch'?watchText(cs):talkText(cs);note(t,cs);D.bubble={room:cs.room,t};renderDinner();}
function swapRooms(a,b){const ra=a.room,rb=b.room;V.rooms[ra]=b;V.rooms[rb]=a;a.room=rb;b.room=ra;V.dinner.swaps--;note(`${nameOf(a)}은(는) ${rb}호로, ${nameOf(b)}은(는) ${ra}호로 방을 바꿨다.`);snd('wood');}
function moveRoom(a,r){const ra=a.room;V.rooms[ra]=null;V.rooms[r]=a;a.room=r;V.dinner.swaps--;note(`${nameOf(a)}을(를) ${r}호로 옮겼다.`);snd('wood');}
function renderDinner(){const D=V.dinner,ppl=seated(),seats=seatsFor(ppl.length);
  const eaten=ppl.map(cs=>D.served&&D.dish!=='none'?D.ate.includes(cs):false);
  const figs=ppl.map((cs,i)=>{const s=seats[i];return `<g class="seat ${D.sel===cs?'sel':''} ${D.swapA===cs?'swapA':''}" data-i="${i}" transform="translate(${s.x} ${s.y}) scale(${s.scale||1})"><rect x="10" y="10" width="180" height="230" fill="transparent"/>${figOf(cs)}</g>`;}).join('');
  const redWall=V.oilType==='oil_red'&&D.served?ppl.map((cs,i)=>cs.fake&&cs.fake.fam==='shadow'?`<g transform="translate(${seats[i].x+40} ${seats[i].y-60}) scale(${(seats[i].scale||1)*.9})" style="filter:brightness(0)" opacity=".45">${figOf(cs)}${shadowExtra(cs.o)}</g>`:'').join(''):'';
  $('dScene').innerHTML=`<svg viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet">${tableBack({seats:ppl.length,dish:D.dish||'none'})}${redWall}${figs}${tableFront({seats:ppl.length,dish:D.served?(D.dish==='bread'?'bread':D.dish||'none'):'none',eaten})}</svg>
   ${ppl.map((cs,i)=>{const s=seats[i];return `<div class="tag3" style="left:${(s.x+100*(s.scale||1))/12}%;top:${(s.y+250*(s.scale||1))/5.2}%">${cs.room}호 · ${nameOf(cs)}</div>`;}).join('')}
   ${D.bubble?(()=>{const i=ppl.findIndex(x=>x.room===D.bubble.room);if(i<0)return'';const s=seats[i];return `<div class="dbub" style="left:${Math.min(78,Math.max(2,(s.x)/12))}%;top:${Math.max(1,(s.y-20)/5.2)}%">${josa(D.bubble.t)}</div>`;})():''}`;
  $('dScene').querySelectorAll('.seat').forEach(g=>g.onclick=()=>{const cs=ppl[+g.dataset.i];
    if(D.swapMode){if(!D.swapA){D.swapA=cs;renderDinner();return;}if(D.swapA===cs){D.swapA=null;renderDinner();return;}swapRooms(D.swapA,cs);D.swapA=null;D.swapMode=false;renderDinner();return;}
    D.sel=cs;D.bubble=null;renderDinner();});
  const sel=D.sel;
  const bar=!D.served?`<span class="dq">오늘 저녁 무엇을 낼까?</span>${dishes().map(k=>`<button class="big b-open" data-dish="${k}">${itemIcon(k,26)} ${ITEM[k].n} <small>×${inv(k)}${ITEM[k].talk?` · 말 +${ITEM[k].talk}`:''}</small></button>`).join('')}<button class="big b-ign" data-dish="none">안 낸다</button>`
   :`<span class="dq">관찰 <b>${D.obs}</b>번 남음 · 방 바꾸기 <b>${D.swaps}</b>번</span>
     ${sel?`<span class="dsel">${sel.room}호 ${nameOf(sel)}</span><button class="big" id="dW" ${D.obs<=0||D.said[sel.room+'watch']?'disabled':''}>지켜보기</button><button class="big" id="dT" ${D.obs<=0||D.said[sel.room+'talk']?'disabled':''}>말 걸기</button>`:'<span class="dsel">사람을 눌러 고른다</span>'}
     <button class="big b-ign" id="dSwap" ${D.swaps<=0?'disabled':''}>${D.swapMode?(D.swapA?`${nameOf(D.swapA)}와(과) 바꿀 사람 선택…`:'바꿀 두 사람을 차례로 누른다'):'방 바꾸기'}</button>
     ${sel&&D.swaps>0&&ROOMS.some(r=>!V.rooms[r]&&!S.stained.includes(r))?`<select id="dMove"><option value="">${nameOf(sel)} → 빈방으로</option>${ROOMS.filter(r=>!V.rooms[r]&&!S.stained.includes(r)).map(r=>`<option value="${r}">${r}호${r===BAR_ROOM?' (빗장 방)':''}</option>`).join('')}</select>`:''}
     <button class="primary" id="dEnd">새벽 순찰로 →</button>`;
  $('dBar').innerHTML=bar;
  $('dBar').querySelectorAll('[data-dish]').forEach(b=>b.onclick=()=>serve(b.dataset.dish));
  const f=(id,fn)=>{const b=$(id);if(b)b.onclick=fn;};
  f('dW',()=>watch(sel,'watch'));f('dT',()=>watch(sel,'talk'));f('dSwap',()=>{D.swapMode=!D.swapMode;D.swapA=null;renderDinner();});f('dEnd',()=>patrolStart());
  const mv=$('dMove');if(mv)mv.onchange=()=>{if(mv.value){moveRoom(sel,+mv.value);renderDinner();}};
  $('dLog').innerHTML=`<h2>식탁 메모</h2><div class="by">— 아리의 수첩</div>
   <div class="roomsMini">${ROOMS.map(r=>`<span class="${S.stained.includes(r)?'stain':V.rooms[r]?'full':''}">${r}<small>${S.stained.includes(r)?'얼룩':V.rooms[r]?nameOf(V.rooms[r]):'빈방'}</small></span>`).join('')}</div>
   <ol class="dnotes">${D.notes.map(n=>`<li>${n.who?`<b>${n.room}호 ${n.who}</b> — `:''}${josa(n.t)}</li>`).join('')||'<li class="nobuy">아직 적은 게 없다.</li>'}</ol>`;
}

// ───────── 새벽 순찰 ─────────
const PCOST={listen:30,look:30,gap:15,knock:15,move:5,lock:10,lamp:5,open:20};
function patrolStart(){
  V.state='patrol';V.stainedAtStart=S.stained.slice();
  V.patrol={pos:0,locks:2,barUsed:false,lampHung:null,opened:false,start:V.clock,notes:[],revealed:{},locked:{},woke:{},bump:{},view:null};
  V.fakes=seated().filter(cs=>cs.fake);
  V.fakes.forEach(cs=>{cs.planNow=cs.fake.plan;if(cs.planNow==='swap'){const i=ROOMS.indexOf(cs.room);
    const nb=[ROOMS[i-1],ROOMS[i+1]].filter(r=>r&&V.rooms[r]&&!V.rooms[r].fake);
    nb.sort((a,b)=>(V.rooms[a].kind==='reg'?0:1)-(V.rooms[b].kind==='reg'?0:1));cs.target=nb[0]||null;if(!cs.target)cs.planNow='flee';}});
  const first=seated()[0];if(first)V.patrol.pos=ROOMS.indexOf(first.room);
  show('patrol');renderPatrol();
  if(S.day===0)ov(`${docHead('등불 길드 여관 · 새벽 순찰',hhmm(V.clock))}<h2>복도를 걷는다</h2><ul>
   <li>←/→ 로 옆 문으로 걷는다. 문 앞의 <b>명패·신발·문틈 불빛</b>은 그냥 보인다.</li>
   <li>문을 직접 누른다: <b>귀 대기</b>(문 판) 30분 · <b>열쇠 구멍</b> 30분(기름 6초) · <b>문틈</b>(문 아래) 15분 · <b>노크</b>(문고리 옆) 15분. 진짜 단골을 깨우면 원망한다.</li>
   <li>조치: <b>잠그기</b>(빗장 2개, 206호는 공짜) · <b>등불 걸기</b>(1번, 그 방은 바꿔치기당하지 않는다. 대신 이후 어둡다) · <b>문 열기</b>(1번).</li>
   <li>05:00에 새벽이 온다. "그것"은 새벽에 움직인다.</li></ul><button class="primary" id="pGo">순찰 시작</button>`),$('pGo').onclick=closeOv;
}
const caught=cs=>!!(V.patrol&&(V.patrol.locked[cs.room]||cs.expelled));
function prog(cs){const P=V.patrol,span=Math.max(60,DAWN-P.start);return Math.min(2,Math.floor(3*(V.clock-P.start)/span)+(P.bump[cs.room]||0));}
function feetOf(cs){if(!cs||!cs.fake||caught(cs))return 0;if(cs.fake.fam==='shadow')return 2;if(cs.fake.fam==='pilgrim')return 1;return prog(cs)>=1?1:0;}
function doorState(r){const cs=V.rooms[r],P=V.patrol;
  const o={no:r,light:'off',feet:0,shoes:'none',shoeMark:'none',lock:!!P.locked[r],lamp:P.lampHung===r,stain:S.stained.includes(r),scratch:0,scratchSide:'L',dark:P.lampHung&&P.lampHung!==r?.5:0};
  if(cs){o.shoes=cs.kind==='guest'?GUEST[cs.id].shoes:((cs.fake&&cs.fake.fam==='mimic'&&REG[cs.id].fakeShoes)||REG[cs.id].shoes);
    o.shoeMark=cs.fl==='B2'?'redsand':cs.fl==='B1'?'mud':'none';
    if((cs.kind==='guest'&&cs.id==='merchant')||(cs.kind==='reg'&&cs.id==='ren'&&!cs.fake))o.light='on';
    if(cs.fake&&cs.fake.fam==='shadow'&&!caught(cs))o.light='flicker';
    if(P.revealed[r+'gap'])o.feet=feetOf(cs);}
  (V.fakes||[]).forEach(f=>{if(f.planNow==='swap'&&f.target&&!caught(f)){const p=prog(f);if(p>=1&&(r===f.room||r===f.target)){o.scratch=Math.max(o.scratch,p);o.scratchSide=r===f.room?(f.target>f.room?'R':'L'):(f.room>f.target?'R':'L');}}});
  return o;}
function listenText(r){const cs=V.rooms[r];let t;
  if(!cs)t='빈방이다. 바람 소리뿐.';
  else if(cs.kind==='guest')t=GUEST[cs.id].listen[cs.fake?1:0];
  else{const fam=cs.fake&&cs.fake.fam;t=HAB[cs.id].listen[fam==='mimic'?1:0];if(fam==='shadow')t+=' …숨소리가 두 겹이다.';}
  if(cs&&cs.fake&&cs.planNow==='lure'&&!caught(cs))t=`"아리… 문 좀 열어 줘요… 추워요…" 누군가 네 이름을 부른다. ${t}`;
  (V.fakes||[]).forEach(f=>{if(f.planNow!=='swap'||caught(f))return;const p=prog(f);
    if(f.target===r&&p>=1)t+=' 벽 너머에서 무언가 긁는 소리가 이쪽으로 다가온다.';
    if(f.room===r&&p>=2)t='방 안이 텅 빈 것처럼 조용하다. 옆방 쪽 벽에서만 사각사각.';});
  if(cs&&caught(cs)&&V.patrol.locked[r]&&cs.fake)t='빗장 너머에서 문을 긁는 소리. 나올 수 없다.';
  return t;}
function soundFor(r){const cs=V.rooms[r];if(!cs)return;if(cs.kind==='reg'&&!cs.fake){if(cs.id==='sere')snd('humBad');else if(['bor','dudu','lulu','pipi'].includes(cs.id))snd('snore');}
  if(cs.kind==='reg'&&cs.fake&&cs.id==='sere')snd('hum');if((V.fakes||[]).some(f=>f.planNow==='swap'&&!caught(f)&&(f.target===r||f.room===r)&&prog(f)>=1))snd('scratch');}
function knockText(r){const cs=V.rooms[r];if(!cs)return '대답이 없다. 빈방이다.';
  if(cs.kind==='guest')return GUEST[cs.id].knock[cs.fake?1:0];
  const fam=cs.fake&&cs.fake.fam;return HAB[cs.id].knock[fam==='mimic'?1:0];}
function placeFig(cs,slot,style=''){const p=roomFig()[slot]||ROOM_FIG_FB[slot];const back=slot==='wall';
  return `<g transform="translate(${p.x} ${p.y}) scale(${p.scale})" style="${style}">${figOf(cs,back)}</g>`;}
function lookScene(r){const cs=V.rooms[r],P=V.patrol,dark=V.oil<=0||!!P.lampHung;const tint=dark?'none':(OILS[V.oilType]||{}).tint||'none';
  const ro={bed:'empty',desk:'empty',mirror:'normal',candle:false,tint,grayStain:false};let figs='',eye=false,t='';
  if(!cs)t='빈방. 침대가 비어 있다.';
  else if(cs.kind==='guest'){if(cs.fake&&!caught(cs)){eye=true;t='열쇠 구멍 바로 반대편에 눈이 하나 붙어 있다. 깜빡이지 않는다.';}
    else{ro.bed='lump';ro.desk=GUEST[cs.id].room.desk;ro.candle=cs.id==='merchant';t=cs.id==='merchant'?'행상인이 촛불 아래 동전을 세다 잠들었다.':'순례자가 침대에 웅크려 잔다.';}}
  else{const fam=cs.fake&&cs.fake.fam;ro.desk=HAB[cs.id].room.desk;
    if(fam==='mimic'&&!caught(cs)){if(cs.id==='ren')ro.desk='empty';
      if(cs.planNow==='swap'&&prog(cs)>=2){ro.grayStain=true;t='침대가 비어 있다. 옆방 쪽 벽지가 불룩하다.';}
      else{figs=placeFig(cs,'wall',tint==='moss'?'filter:grayscale(1) brightness(.85)':'');t='침대는 그대로다. 누군가 벽을 보고 서 있다. 움직이지 않는다.'+(tint==='moss'?' 이끼 기름 빛 아래 피부가 잿빛이다.':'');}}
    else if(fam==='shadow'&&!caught(cs)){ro.bed='lump';figs=`<g transform="translate(${roomFig().wall.x} ${roomFig().wall.y}) scale(${roomFig().wall.scale})" style="filter:brightness(0)" opacity="${tint==='red'?.8:.3}">${figOf(cs)}${shadowExtra(cs.o)}</g>`;
      t='침대에 한 사람이 자고 있다. 그런데 벽에 그림자가 따로 서 있다.'+(tint==='red'?' 붉은 빛 아래 그림자의 머리 위로 뭔가 솟아 있다.':' 흐릿해서 잘 보이지 않는다.');}
    else if(cs.id==='ren'&&!cs.fake){ro.desk='list';ro.candle=true;figs=placeFig(cs,'desk');t='렌이 책상에서 채집 목록을 정리하다 졸고 있다.';}
    else{ro.bed='lump';t=`${C[cs.id].name}이(가) 이불을 덮고 잔다.`+(cs.id==='mumy'?' 투구를 쓴 채로.':'');}}
  if(dark&&!eye)t='너무 어둡다. 형체만 겨우 보인다. '+t;
  return{svg:eye?eyeSvg(cs&&cs.kind==='guest'?'#9a9a8a':'#666'):roomSvg(ro)+figs,t,dark};}
function pNote(r,t){V.patrol.notes.unshift({r,who:V.rooms[r]?nameOf(V.rooms[r]):'빈방',t,at:hhmm(V.clock)});}
function spend(m){V.clock=Math.min(DAWN,V.clock+m);hud();}
function pMove(d){const P=V.patrol;const np=Math.max(0,Math.min(ROOMS.length-1,P.pos+d));if(np===P.pos)return;P.pos=np;P.view=null;spend(PCOST.move);snd('step');renderPatrol();checkDawn();}
function pGoto(i){const P=V.patrol;if(i===P.pos)return;const d=Math.abs(i-P.pos);P.pos=i;P.view=null;spend(PCOST.move*d);snd('step');renderPatrol();checkDawn();}
function pAct(a){const P=V.patrol,r=ROOMS[P.pos],cs=V.rooms[r];if(V.clock>=DAWN)return;
  if(a==='look'){if(!P.lampHung&&V.oil>0)V.oil=Math.max(0,V.oil-6);const L=lookScene(r);P.view=L;pNote(r,'열쇠 구멍: '+L.t);spend(PCOST.look);snd('creak');}
  else if(a==='listen'){pNote(r,'귀 대기: '+listenText(r));soundFor(r);spend(PCOST.listen);}
  else if(a==='gap'){P.revealed[r+'gap']=1;const n=cs?feetOf(cs):0;pNote(r,'문틈: '+(n===0?'캄캄하다. 문 뒤에 아무도 서 있지 않다.':n===1?'문 바로 뒤에 발 그림자 한 쌍. 누군가 문에 붙어 서 있다.':'문 바로 뒤에 발 그림자가 두 쌍. 한 사람만 묵는 방인데.'));spend(PCOST.gap);}
  else if(a==='knock'){snd('knock');pNote(r,'노크: '+knockText(r));if(cs&&cs.kind==='reg'&&!cs.fake)P.woke[r]=1;if(cs&&cs.fake&&cs.fake.fam==='mimic')P.bump[r]=1;spend(PCOST.knock);}
  renderPatrol();checkDawn();}
function pLock(){const P=V.patrol,r=ROOMS[P.pos];if(P.locked[r])return;const free=r===BAR_ROOM&&!P.barUsed;if(!free&&P.locks<=0){toast('빗장이 더 없다','bad');return;}
  if(free)P.barUsed=true;else P.locks--;P.locked[r]=1;snd('wood');pNote(r,'빗장을 걸었다.');spend(PCOST.lock);renderPatrol();checkDawn();}
function pLamp(){const P=V.patrol,r=ROOMS[P.pos];if(P.lampHung)return;P.lampHung=r;pNote(r,'문고리에 등불을 걸었다. 이제 손에 불이 없다.');spend(PCOST.lamp);renderPatrol();checkDawn();}
function pOpen(){const P=V.patrol,r=ROOMS[P.pos];if(P.opened)return;
  ov(`<h2>${r}호 문을 연다</h2><p>수칙을 떠올린다. 어떻게 열까?</p>
   <button class="primary" id="oA" ${P.lampHung?'disabled':''}>등불을 먼저 들이민다${P.lampHung?' (등불이 없다)':''}</button> <button class="primary ghost" id="oB">등불을 끄고 연다</button> <button class="primary ghost" id="oC">그만둔다</button>`);
  $('oA').onclick=()=>{closeOv();openResult('lamp');};$('oB').onclick=()=>{closeOv();openResult('dark');};$('oC').onclick=closeOv;}
function openResult(m){const P=V.patrol,r=ROOMS[P.pos],cs=V.rooms[r];P.opened=true;spend(PCOST.open);snd('creak');
  if(cs&&cs.fake&&!caught(cs)){if(m==='lamp'){cs.expelled=true;snd('eerie');pNote(r,`문 열기: 등불을 먼저 들이밀자, ${nameOf(cs)}의 얼굴을 한 그것이 빛에 닿아 연기처럼 흩어졌다.`);}
    else{pNote(r,'문 열기: 불을 끄고 문을 열었다.');renderPatrol();later(()=>gameOver('red2'),300);return;}}
  else if(cs){if(cs.kind==='reg')P.woke[r]=1;pNote(r,`문 열기: 곤히 자던 ${nameOf(cs)}이(가) 깼다. "…뭐야?" 진짜다.`);}
  else pNote(r,'문 열기: 빈방이다.');
  renderPatrol();checkDawn();}
function checkDawn(){if(V.clock>=DAWN&&V.state==='patrol'){V.state='dawn';toast('창밖이 밝아 온다. 새벽이다.','info');later(resolveMorning,1200);}}
function endPatrol(){if(V.state!=='patrol')return;V.clock=DAWN;hud();checkDawn();}
function renderPatrol(){const P=V.patrol,r=ROOMS[P.pos],o=doorState(r),cs=V.rooms[r],sp=spots();
  const dawn=Math.max(0,Math.min(1,(V.clock-P.start)/Math.max(60,DAWN-P.start)));
  const dx=420,dy=118,sc=1;
  const hot=(k,x,y,w,h)=>`<rect class="hot" data-a="${k}" x="${dx+x*sc}" y="${dy+y*sc}" width="${w*sc}" height="${h*sc}" rx="8"/>`;
  const kh=sp.keyhole;
  $('pScene').innerHTML=`<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">${corridorSvg({dawn,lampOn:!P.lampHung,leftNo:ROOMS[P.pos-1]||null,rightNo:ROOMS[P.pos+1]||null})}
   <g transform="translate(${dx} ${dy}) scale(${sc})">${doorSvg(o)}</g>
   <text x="${dx+(sp.plate.x+sp.plate.w/2)*sc}" y="${dy+(sp.plate.y+sp.plate.h/2+6)*sc}" text-anchor="middle" font-size="17" font-weight="800" fill="#382c2b" font-family="Pretendard Variable,sans-serif">${cs?nameOf(cs):'빈방'}</text>
   ${hot('listen',sp.ear.x,sp.ear.y,sp.ear.w,sp.ear.h)}${hot('gap',sp.gap.x,sp.gap.y,sp.gap.w,sp.gap.h)}${hot('knock',sp.knock.x,sp.knock.y,sp.knock.w,sp.knock.h)}
   <circle class="hot" data-a="look" cx="${dx+kh.x*sc}" cy="${dy+kh.y*sc}" r="${(kh.r||20)*sc+6}"/>
   ${P.lampHung?'':`<circle cx="600" cy="420" r="520" fill="url(#pl)" pointer-events="none"/>`}
   <defs><radialGradient id="pl"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".0"/></radialGradient></defs></svg>
   <button class="parr l" id="pL" ${P.pos===0?'disabled':''}>◀ ${ROOMS[P.pos-1]||''}</button><button class="parr r" id="pR" ${P.pos===ROOMS.length-1?'disabled':''}>${ROOMS[P.pos+1]||''} ▶</button>
   <div class="hotTip" id="hotTip"></div>
   ${P.view?`<div class="khole"><div class="kc"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">${P.view.svg}</svg></div><p>${josa(P.view.t)}</p><button class="primary ghost" id="kClose">눈을 뗀다</button></div>`:''}`;
  const tipT={listen:'귀 대기 · 30분',look:`열쇠 구멍 · 30분${P.lampHung?' (등불이 없다)':' · 기름 6초'}`,gap:'문틈 보기 · 15분',knock:'노크 · 15분 (진짜를 깨우면 원망)'};
  $('pScene').querySelectorAll('.hot').forEach(h=>{h.onclick=()=>pAct(h.dataset.a);h.onmouseenter=()=>{$('hotTip').textContent=tipT[h.dataset.a];$('hotTip').classList.add('on');};h.onmouseleave=()=>$('hotTip').classList.remove('on');});
  $('pL').onclick=()=>pMove(-1);$('pR').onclick=()=>pMove(1);const kc=$('kClose');if(kc)kc.onclick=()=>{P.view=null;renderPatrol();};
  $('pStrip').innerHTML=ROOMS.map((rr,i)=>{const c=V.rooms[rr];return `<button class="${i===P.pos?'here':''} ${S.stained.includes(rr)?'stain':''}" data-i="${i}"><b>${rr}</b><span>${c?nameOf(c):'빈방'}</span><i>${P.locked[rr]?'빗장':''}${P.lampHung===rr?' 등불':''}</i></button>`;}).join('');
  $('pStrip').querySelectorAll('button').forEach(b=>b.onclick=()=>pGoto(+b.dataset.i));
  const left=DAWN-V.clock;
  $('pLog').innerHTML=`<h2>순찰 기록</h2><div class="by">새벽 5시까지 ${Math.floor(left/60)}시간 ${left%60}분</div>
   <div class="pacts"><button class="big" id="aLock" ${P.locked[r]||(!(r===BAR_ROOM&&!P.barUsed)&&P.locks<=0)?'disabled':''}>잠그기 <small>${r===BAR_ROOM&&!P.barUsed?'빗장 방 · 공짜':`빗장 ${P.locks}`}</small></button>
    <button class="big" id="aLamp" ${P.lampHung?'disabled':''}>등불 걸기 <small>${P.lampHung?P.lampHung+'호에 걸림':'1번'}</small></button>
    <button class="big" id="aOpen" ${P.opened?'disabled':''}>문 열기 <small>${P.opened?'썼다':'1번'}</small></button>
    <button class="big b-ign" id="aEnd">새벽까지 기다린다</button></div>
   <ol class="dnotes">${P.notes.map(n=>`<li><b>${n.r}호 ${n.who}</b> <small>${n.at}</small><br>${josa(n.t)}</li>`).join('')||'<li class="nobuy">문을 눌러 엿듣거나 들여다본다.</li>'}</ol>`;
  const f=(id,fn)=>{const b=$(id);if(b)b.onclick=fn;};f('aLock',pLock);f('aLamp',pLamp);f('aOpen',pOpen);f('aEnd',endPatrol);
  hud();}

// ───────── 아침 계산 ─────────
function resolveMorning(){
  V.running=false;tok++;
  const P=V.patrol||{locked:{},woke:{}},before=S.thread,cards=[],notes=[];let dT=0;
  const card=(cs,title,text,delta,cls,money)=>cards.push({fig:cs?svg(figOf(cs),64):'',title,text,delta,cls,money});
  const lost=new Set();
  // 1) "그것"의 계획
  (V.fakes||[]).forEach(f=>{if(caught(f))return;if(f.kind==='reg'&&f.fake.fam==='mimic')notes.push(`진짜 ${C[f.id].name}은(는) 아침 굴 입구에서 멍하니 앉은 채 발견됐다. 지난밤 여관에 있던 건 누구였을까.`);
    if(f.planNow==='swap'&&f.target&&P.lampHung!==f.target&&V.rooms[f.target]){const t=V.rooms[f.target];lost.add(t);
      if(t.kind==='reg')S.regs[t.id].gone='missing';S.stained.push(f.target);dT-=3;
      card(t,`${f.target}호 — ${nameOf(t)}`,`아침, ${f.target}호는 비어 있었다. 침대 위에 ${nameOf(t)}의 물건만 남았다. 옆방 ${f.room}호에 묵던 "${nameOf(f)}"도 사라졌다 — 그것이었다. ${t.kind==='reg'?`${nameOf(t)}은(는) 다시 돌아오지 않는다.`:''}`,-3,'lost');}
    else{S.stained.push(f.room);const dl=f.planNow==='swap'?-1:-2;dT+=dl;
      card(f,`${f.room}호 — ${nameOf(f)}`,f.planNow==='swap'?`새벽에 ${f.target}호 쪽 벽을 긁던 소리가 등불 앞에서 멎었다. ${f.room}호에는 잿빛 얼룩만 남았다.`:f.planNow==='lure'?'새벽에 사라졌다. 벽에 잿빛 손자국이 문 쪽을 향해 찍혀 있다.':'새벽에 사라졌다. 침대 위에 그림자 모양의 얼룩이 남았다.',dl,'bad');}});
  // 2) 방마다
  ROOMS.forEach(r=>{const cs=V.rooms[r];if(!cs||lost.has(cs))return;
    if(cs.fake){if(!caught(cs))return;dT+=1;
      card(cs,`${r}호 — 가짜 ${nameOf(cs)}`,cs.expelled?'등불에 닿아 흩어졌다. 방에는 젖은 흙냄새만.':'빗장 너머에서 밤새 문을 긁었다. 아침에 경계청이 문을 열자, 안에는 '+(cs.fake.fam==='shadow'?'그림자 모양의 재만 남아 있었다.':'잿빛 곰팡이 덩어리가 사람 모양으로 굳어 있었다.'),1,'good');
      if(cs.kind==='reg'&&cs.fake.fam==='mimic')notes.push(`진짜 ${C[cs.id].name}은(는) 아침 굴 입구에서 잠든 채 발견됐다. 무사하다.`);return;}
    if(cs.kind==='guest'){S.money+=GUEST[cs.id].fee;card(cs,`${r}호 — ${nameOf(cs)}`,'무사히 깨어 숙박비를 치르고 떠났다.',0,'good',GUEST[cs.id].fee);return;}
    let t='',g=0;dT+=1;
    if(P.locked[r]){g++;t+=' 밤새 방에 갇혀 있었다. "왜 가뒀어?"';}
    if(P.woke[r]){g++;t+=' 한밤중에 깨워서 뿔이 났다.';}
    if(cs.haggled){g++;t+=' 어제 전리품 값을 깎인 게 아직 서운하다.';}
    if(V.dinner&&V.dinner.spore&&V.dinner.ate.includes(cs)){S.regs[cs.id].hurt='moss';t+=' 저녁 요리를 먹고 어깨에 포자가 폈다.';}
    if(cs.hurt){S.regs[cs.id].hurt=cs.hurt;t+=' 다친 곳은 치료해야 한다.';}
    S.regs[cs.id].grudge+=g;
    card(cs,`${r}호 — ${C[cs.id].name}`,`무사히 깨어났다.${t}`,1,g?'mid':'good');});
  // 3) 돌려보낸 사람
  V.refused.forEach(cs=>{if(cs.fake){notes.push(`돌려보낸 "${nameOf(cs)}"… 아침에 보니 문 앞에 잿빛 발자국만 있었다.`);return;}
    if(cs.kind==='reg'){const R=S.regs[cs.id];R.grudge++;if(rnd()<.4)R.hurt=cs.fl==='B2'?'sand':'moss';
      card(cs,`여관 밖 — ${C[cs.id].name}`,`${cs.unseen?'창구가 닫혀':'돌려보내져'} 밖에서 밤을 샜다.${R.hurt?' 몸이 상했다.':''} "다음엔 들여보내 줘."`,0,'mid');}
    else notes.push(`${nameOf(cs)}은(는) 다른 여관을 찾아갔다.`);});
  // 4) 수칙 줄 긋기 (한 번만 계산)
  S.scored=S.scored||[];
  S.struck.filter(id=>!S.scored.includes(id)).forEach(id=>{const rl=RULES.find(x=>x.id===id);if(!rl||(rl.day!==undefined&&rl.day>S.day))return;S.scored.push(id);
    if(rl.fake){dT+=1;notes.push(`가짜 줄(${rl.n}번 "${rl.t.slice(0,16)}…")에 줄을 그었다. 실 +1`);}else{dT-=1;notes.push(`마그다의 수칙 ${rl.n}번에 줄을 그었다. 모모가 울상이다. 실 −1`);}});
  // 5) 수선하지 않은 얼룩
  const old=(V.stainedAtStart||[]).length;if(old){dT-=old;notes.push(`수선하지 않은 얼룩진 방 ${old}개에서 실이 풀렸다. 실 −${old}`);}
  // 6) 창고의 저주받은 물건
  if(inv('coin')){const n=inv('coin');addInv('coin',-n);addInv('leaf',n);notes.push('창고의 금화가 밤사이 나뭇잎이 됐다.');}
  if(inv('shadow')){const n=inv('shadow');addInv('shadow',-n);dT-=n;notes.push(`창고의 그림자 조각이 사라지며 벽에 얼룩을 남겼다. 실 −${n}`);}
  // 7) 조사 의뢰 보상
  (S.sent||[]).forEach((p,pi)=>{if(p.req.need)return;const ok=V.admitted.some(cs=>cs.kind==='reg'&&cs.party===pi&&!cs.fake&&!lost.has(cs));
    if(ok){S.money+=p.req.reward;notes.push(`${p.req.by} 조사 의뢰 보상 +${p.req.reward}G`);}else notes.push(`${p.req.by} 조사 의뢰 — 무사히 돌아온 사람이 없어 보상이 없다.`);});
  S.pending=S.pending.filter(p=>p.req.need&&!p.done);
  // 8) 원망이 쌓이면 떠난다
  REG_IDS.forEach(id=>{const R=S.regs[id];if(!R.gone&&R.grudge>=2){R.gone='left';notes.push(`${C[id].name}은(는) 원망이 쌓여 길드를 떠났다.`);}});
  S.thread+=dT;clampThread();S.stained=[...new Set(S.stained)];S.sent=null;
  const res={before,cards,notes};S.day++;
  if(S.day===1){addInv('sand',1);notes.push('경계청 공문이 왔다. B2 붉은 달의 황야 개방. 붉은 모래 표본 한 줌이 동봉돼 있다. (가마솥: 붉은 모래 + 기름 = 붉은 기름, 그림자가 선명해진다)');}
  if(S.thread<=0){gameOver('thread');return;}
  if(S.day>=DAYS_N){settle(res);return;}
  morningStart(res);
}
function settle(res){show('morning');V=null;MRES=res;
  const lostN=REG_IDS.filter(id=>S.regs[id].gone==='missing').length,leftN=REG_IDS.filter(id=>S.regs[id].gone==='left').length;
  const paid=S.money>=RENT;
  $('mNav').innerHTML='';$('mBody').innerHTML=`<div class="paperPage">${docHead('등불 길드 여관 · 주말 결산','3일째 밤이 지난 아침')}<h2>주말 결산</h2>
   <div class="threadSum">경계의 실 <b>${res.before}</b> → <b>${S.thread}</b> / ${THREAD_MAX}</div>
   <div class="scenes">${res.cards.map(c=>`<div class="scene ${c.cls||''}"><div class="sp">${c.fig||''}</div><div><b>${c.title}</b><p>${c.text}</p></div></div>`).join('')}</div>
   ${res.notes.length?`<ul class="mnotes">${res.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}
   <div class="sum"><div><b>${S.money}G</b>남은 돈</div><div><b>${S.thread}</b>경계의 실</div><div><b>${lostN}</b>잃은 단골</div><div><b>${leftN}</b>떠난 단골</div></div>
   ${paid?'':'<p class="badN"><b>운영비가 모자란다.</b></p>'}<button class="primary" id="payRent">${paid?`운영비 ${RENT}G를 낸다`:'결산을 마친다'}</button></div>`;
  $('payRent').onclick=()=>{if(!paid){gameOver('shut');return;}S.money-=RENT;ending(lostN,leftN);};}
function ending(lostN,leftN){const t=S.thread,good=t>=14&&!lostN;
  ov(`${docHead('등불 길드 여관','1주 차 끝')}<h2>${good?'여관이 조용히 숨을 쉰다':t>=8?'실은 아직 버틴다':'벽지 너머에서 무언가 숨을 쉰다'}</h2>
   <p>${good?'한 주 동안 돌아온 이들이 모두 제 방에서 깨어났다. 경계의 실이 촘촘하다. 모모가 처음으로 웃었다.':t>=8?'몇 번은 놓쳤다. 그래도 실은 아직 버틴다. 복도 끝 벽지에 난 얼룩이 아주 조금 넓어졌다.':'실이 많이 풀렸다. 밤마다 복도 끝에서 누군가 네 이름을 부른다.'}${lostN?` 돌아오지 않은 단골이 ${lostN}명.`:''}</p>
   <p>남은 돈 ${S.money}G · 경계의 실 ${t}/${THREAD_MAX}</p>
   <h3 class="secH">재미 체크</h3>
   <div class="q">재미있었나요? ${[1,2,3,4,5].map(n=>`<label><input type="radio" name="fun" value="${n}"> ${n}</label>`).join('')}</div>
   <div class="q">끌린 것 (여러 개)<br>${['파티 보내기','가마솥(요리·기름)','창구 검역','전리품 감정','저녁 식당','새벽 순찰','가짜 수칙','경계의 실'].map(x=>`<label><input type="checkbox" name="pick" value="${x}"> ${x}</label>`).join('')}</div>
   <div class="q">가장 재미있던 순간<textarea id="best"></textarea></div><div class="q">지루하거나 헷갈렸던 점<textarea id="worst"></textarea></div>
   <button class="primary" id="saveBtn">저장</button> <button class="primary ghost" onclick="location.reload()">처음부터 다시</button>`);
  $('saveBtn').onclick=()=>{const v=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value||'';const picks=[...document.querySelectorAll('input[name=pick]:checked')].map(x=>x.value).join(', ');
    try{const a=JSON.parse(localStorage.getItem('srg_toys')||'{}');a.proto5={fun:v('fun'),best:(picks?'['+picks+'] ':'')+$('best').value,worst:$('worst').value,score:{money:S.money,thread:S.thread,lost:lostN,left:leftN},at:new Date().toISOString()};localStorage.setItem('srg_toys',JSON.stringify(a));}catch(e){}
    $('saveBtn').textContent='저장했습니다';$('saveBtn').disabled=true;};}
function gameOver(kind){if(V)V.running=false;tok++;
  const T={red:['붉은 줄','셔터가 안쪽에서 두드려졌다. 세 번. 아리는 창구를 열었다.<br>수칙 4번: 창구를 세 번 두드리면 절대 열지 마십시오.','night'],
    red2:['불 꺼진 방','불을 끄고 문을 열었다. 어둠 속에서 누군가 아리의 목소리로 "고마워"라고 말했다.<br>그 수칙은 마그다의 필체가 아니었다.','night'],
    thread:['경계의 실','실이 다 풀렸다. 새벽, 여관 복도가 한 칸 더 길어졌다. 그 끝에 13번 출입구가 열려 있다.','morning'],
    shut:['폐업','주말 운영비를 내지 못했다. 경계청이 여관 문에 봉인 딱지를 붙였다.','morning']}[kind];
  ov(`<h2 class="goH">게임 오버 — ${T[0]}</h2><p class="goP">${T[1]}</p><button class="primary" id="again">${T[2]==='night'?'오늘 저녁 처음부터':'오늘 아침 처음부터'}</button> <button class="primary ghost" onclick="location.reload()">처음부터</button>`,'over');
  $('again').onclick=()=>{closeOv();if(T[2]==='night'){S=JSON.parse(SNAP.night);eveningStart();}else{S=JSON.parse(SNAP.morning);if(S.day>=DAYS_N)S.day=DAYS_N-1;morningStart(null);}};}

// ───────── 입력 ─────────
addEventListener('keydown',e=>{if(!$('ov').hidden||!V)return;
  const CODE={KeyQ:'q',KeyA:'a',KeyR:'r',KeyX:'x',KeyG:'g',KeyC:'c',KeyE:'e',Digit1:'1',Digit2:'2',Digit3:'3',Numpad1:'1',Numpad2:'2',Numpad3:'3',ArrowLeft:'left',ArrowRight:'right'};
  const k=CODE[e.code]||e.key.toLowerCase();
  if(STAGE==='window'){
    if(V.state==='loot'){if(k==='e')lootAct('look');else if(k==='1')lootAct('buy');else if(k==='2')lootAct('haggle');else if(k==='3')lootAct('no');return;}
    if(e.code==='Space'){e.preventDefault();openS();}else if(k==='x')ignoreS();else if(k==='c')closeWindow();
    else if(k==='r')useCheck('lamp');else if(k==='a')useCheck('ask');else if(k==='q')useCheck('pw');else if(k==='g')joinTally();
    else if(k==='1')admit();else if(k==='2')refuse();}
  else if(STAGE==='patrol'&&V.state==='patrol'){if(k==='left')pMove(-1);else if(k==='right')pMove(1);}
});
$('shutter').onclick=()=>{if(V&&V.state==='knock')openS();};

// ───────── 시작 ─────────
morningStart(null);
window.__p={get S(){return S},get V(){return V},get STAGE(){return STAGE},get SEND(){return SEND},renderMorning,depart,openS,ignoreS,useCheck,joinTally,admit,doAdmit:r=>doAdmit(V.cur,r),refuse,lootAct,closeWindow,
  serve,watch,swapRooms,patrolStart,pMove,pGoto,pAct,pLock,pLamp,openResult,endPatrol,resolveMorning,gameOver,seated,setTab:t=>{MTAB=t;renderMorning();}};

</script>
